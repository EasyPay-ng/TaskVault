<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finding Match — TaskVault</title>
<link rel="icon" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg" type="image/jpeg">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="assets/game.css" rel="stylesheet">
<style>
body { background: #120D08; }
.mm { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px 22px; text-align: center; }
.radar {
  width: 168px; height: 168px; border-radius: 50%; position: relative;
  background: radial-gradient(circle, rgba(255,140,66,.10) 0%, rgba(255,140,66,.03) 60%, transparent 70%),
              repeating-radial-gradient(circle, rgba(255,140,66,.16) 0 1px, transparent 1px 28px);
  border: 1.5px solid rgba(255,140,66,.35);
  box-shadow: 0 0 44px rgba(255,140,66,.16), inset 0 0 34px rgba(255,140,66,.08);
}
.radar .sweep {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(255,140,66,.5), transparent 72deg, transparent);
  animation: spin 1.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.radar .core {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 54px; height: 54px; border-radius: 50%; background: var(--gradient-orange);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px;
  box-shadow: 0 6px 20px rgba(255,107,53,.45);
}
.mm h2 { margin-top: 22px; font-size: 17px; font-weight: 800; color: #fff; letter-spacing: .4px; }
.mm .sub { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 4px; }
.dotx i { color: #FF8C42; font-size: 7px; animation: blink 1.2s infinite; }
.dotx i:nth-child(2){ animation-delay:.2s } .dotx i:nth-child(3){ animation-delay:.4s }
@keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

.roster { width: 100%; max-width: 380px; margin-top: 24px; display: flex; flex-direction: column; gap: 7px; }
.slot-row {
  display: flex; align-items: center; gap: 11px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
  border-radius: 13px; padding: 10px 13px;
  animation: fillin .35s ease-out backwards;
}
@keyframes fillin { from { opacity: 0; transform: translateY(8px); } }
.slot-row .av {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff;
}
.slot-row .av.me { background: var(--gradient-orange); }
.slot-row .av.b1 { background: #3B82F6; } .slot-row .av.b2 { background: #8B5CF6; }
.slot-row .av.b3 { background: #10B981; } .slot-row .av.b4 { background: #64748B; }
.slot-row .nm { flex: 1; text-align: left; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.92); }
.slot-row .nm small { display: block; font-size: 8.5px; font-weight: 600; color: rgba(255,255,255,.45); letter-spacing: .6px; }
.slot-row .st { font-size: 9px; font-weight: 700; color: #4ADE80; }
.slot-row .st.wait { color: rgba(255,255,255,.35); }

.econ {
  width: 100%; max-width: 380px; margin-top: 20px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
  border-radius: 14px; padding: 12px 15px;
  display: flex; justify-content: space-between; text-align: left;
}
.econ div b { display: block; font-size: 13px; font-weight: 800; color: #fff; }
.econ div span { font-size: 8.5px; color: rgba(255,255,255,.5); font-weight: 600; letter-spacing: .5px; }
.fee-paid { margin-top: 14px; font-size: 10px; color: rgba(255,255,255,.55); }
.fee-paid b { color: #F87171; }
.ready-bar {
  position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
  background: rgba(10,7,4,.8); backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,.08);
  display: none;
}
.ready-bar.show { display: block; animation: fillin .3s ease-out; }
.ready-bar .btn { width: 100%; }
</style>
</head>
<body>
<div class="app-container" style="background:#120D08">

  <header class="topbar" style="background:rgba(18,13,8,.9)">
    <a href="loadout.html" class="icon-btn ghost" id="backBtn" style="color:#fff"><i class="ri-arrow-left-s-line"></i></a>
    <div class="topbar-title"><h1 style="color:#fff">Matchmaking</h1><p id="flowTxt" style="color:rgba(255,255,255,.55)">—</p></div>
    <a href="store.html" class="wallet-row" id="walletLink" data-wallet style="text-decoration:none"></a>
  </header>

  <div class="scroll-content" style="display:flex;flex-direction:column">
    <div class="mm">
      <div class="radar"><div class="sweep"></div><div class="core"><i class="ri-crosshair-2-fill"></i></div></div>
      <h2 id="statusTxt">Searching for players<span class="dotx"><i>.</i><i>.</i><i>.</i></span></h2>
      <div class="sub" id="subTxt">Entry $0.10 · Win $0.30</div>

      <div class="roster" id="roster"></div>

      <div class="econ">
        <div><b>$0.10</b><span>ENTRY FEE</span></div>
        <div><b>$0.30</b><span>WIN REWARD</span></div>
        <div><b id="wrTxt">—</b><span>YOUR WIN RATE</span></div>
        <div><b id="tierTxt">—</b><span>LOBBY SKILL</span></div>
      </div>
      <div class="fee-paid">Entry fee paid: <b>$0.10</b> · forfeits are not refunded</div>
    </div>
  </div>

  <div class="ready-bar" id="readyBar">
    <button class="btn btn-primary" id="deployBtn"><i class="ri-sword-fill"></i> Deploy Now</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="assets/game.js"></script>
<script>
const M = TVG.state.match;
if (!M || !M.map) { location.replace('game-hub.html'); throw new Error('no match state'); }
if (typeof TVG.chargeEntry !== 'function' || typeof TVG.winRate !== 'function') {
  statusTxt.textContent = 'Please update assets/game.js to the new version';
  TVG.toast('assets/game.js is outdated — replace it first', 'error');
  throw new Error('game.js outdated');
}

const isBR = M.gameMode === 'Battle Royale';
flowTxt.textContent = (isBR ? 'Battle Royale · ' : M.type.toUpperCase() + ' · ') + TVG.map(M.map).name;

/* ---- 1. charge the entry fee up front ---- */
if (!M.feePaid) {
  const r = TVG.chargeEntry();
  if (!r.ok) {
    TVG.toast(r.msg, 'error');
    setTimeout(() => location.href = 'deposit.html', 1300);
    throw new Error('no-balance');
  }
  M.feePaid = true;
  TVG.state.match = M;
  TVG.save();
}

/* ---- 2. lobby stats ---- */
const wr = TVG.winRate();
wrTxt.textContent = wr === null ? '40%' : Math.round(wr * 100) + '%';
const dda = TVG.ddaFactor();
tierTxt.textContent = dda >= 1.35 ? 'HARD' : dda >= 1.1 ? 'TOUGH' : dda > 0.9 ? 'FAIR' : dda > 0.75 ? 'EASY' : 'CASUAL';

/* ---- 3. build the roster ---- */
const ME = TVG.state.player.name;
const names = TVG.shuffle(TVG.BOT_NAMES.filter(n => n !== ME));
const squadSize = isBR ? 1 : M.size;                    // BR = solos
const lobbySize = isBR ? 12 : squadSize * 2;            // BR = 12 players

let roster = [];
if (isBR) {
  roster = [ME, ...names.slice(0, lobbySize - 1)];
} else {
  const teamA = [ME, ...names.slice(0, squadSize - 1)];
  const teamB = names.slice(squadSize - 1, squadSize * 2 - 1);
  roster = teamA.concat(teamB);
}

const rows = roster.map((n, i) => {
  const me = n === ME;
  const team = !isBR && (i >= squadSize ? 'ENEMY' : 'ALLY');
  const cls = me ? 'me' : 'b' + ((i % 4) + 1);
  return { n, me, team, cls, delay: .25 + i * .16 };
});

/* rosterEl = the DOM list (the local `roster` array below shadows the
   id-global, so we must NOT rely on the bare `roster` global here) */
const rosterEl = document.getElementById('roster');

function renderRows(count) {
  rosterEl.innerHTML = rows.slice(0, count).map(r => `
    <div class="slot-row" style="animation-delay:${r.delay}s">
      <div class="av ${r.cls}">${r.me ? '<i class="ri-user-3-fill"></i>' : TVG.initials(r.n)}</div>
      <div class="nm">${r.n}${r.me ? ' (YOU)' : ''}<small>${isBR ? 'SOLO' : r.team}</small></div>
      <div class="st">${r.me || count > rows.indexOf(r) + 1 ? 'READY' : ''}</div>
    </div>`).join('');
}

let filled = 1;
renderRows(1);
backBtn.onclick = () => location.href = 'loadout.html';

/* fill the lobby one by one */
const fillTimer = setInterval(() => {
  filled++;
  renderRows(filled);
  if (filled >= rows.length) {
    clearInterval(fillTimer);
    setTimeout(() => {
      statusTxt.innerHTML = 'Match found!';
      subTxt.textContent = (isBR ? lobbySize : squadSize * 2) + ' players · ' + TVG.map(M.map).name;
      readyBar.classList.add('show');
    }, 500);
  }
}, 420);

deployBtn.onclick = () => {
  /* hand the roster to the match */
  if (isBR) {
    M.teamA = [ME];
    M.teamB = rows.filter(r => !r.me).map(r => r.n);
    M.type = 'br'; M.size = 1;
  } else {
    M.teamA = roster.slice(0, squadSize);
    M.teamB = roster.slice(squadSize);
  }
  M.vsBots = true;
  M.roster = roster;
  TVG.state.match = M;
  TVG.save();
  location.href = 'match.html';
};
</script>
