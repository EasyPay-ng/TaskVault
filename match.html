<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>In Match — TaskVault</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange-main:#FF8C42; --gradient-orange:linear-gradient(135deg,#FF8C42 0%,#FF6B35 100%);
  --team-blue:#3B82F6; --team-red:#EF4444; --success:#10B981;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0d0906;}
#stage{position:fixed;inset:0;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ---------- ROTATE GATE ---------- */
#rotate{
  position:fixed;inset:0;background:#FDFBF7;z-index:900;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:32px;
}
#rotate i{font-size:52px;color:var(--orange-main);animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#rotate h2{font-size:16px;font-weight:800;color:#333}
#rotate p{font-size:12px;color:#888;max-width:280px;line-height:1.6}
@media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} #hud{display:none} }

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:100}
.hb{pointer-events:auto}

/* top bar */
.top{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
}
.score{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.93);border-radius:12px;padding:5px 12px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.score b{font-size:17px;font-weight:800;line-height:1}
.score .blue{color:var(--team-blue)} .score .red{color:var(--team-red)}
.score .clock{font-size:13px;font-weight:700;color:#333;padding:0 4px;border-left:1px solid #eee;border-right:1px solid #eee}
.score small{display:block;font-size:7.5px;color:#999;letter-spacing:.6px;text-align:center;font-weight:600}
.top-right{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:7px}
.sq{
  width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;color:#444;font-size:15px;
  border:none;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.22);
}

/* minimap */
#mini{
  position:absolute;left:14px;top:calc(52px + env(safe-area-inset-top));
  width:76px;height:76px;border-radius:12px;background:rgba(255,255,255,.86);
  box-shadow:0 4px 14px rgba(0,0,0,.25);overflow:hidden;
}

/* killfeed */
#feed{position:absolute;right:14px;top:calc(52px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kf{
  background:rgba(0,0,0,.62);color:#fff;font-size:9.5px;font-weight:600;
  padding:4px 9px;border-radius:7px;animation:kfIn .25s ease-out;
  display:flex;align-items:center;gap:6px;
}
@keyframes kfIn{from{opacity:0;transform:translateX(14px)}}
.kf i{color:var(--orange-main);font-size:10px}

/* crosshair */
#cross{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:22px;height:22px;
}
#cross::before,#cross::after{content:'';position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 3px rgba(0,0,0,.6)}
#cross::before{left:50%;top:0;width:1.5px;height:100%;margin-left:-.75px}
#cross::after{top:50%;left:0;height:1.5px;width:100%;margin-top:-.75px}
#cross.hit::before,#cross.hit::after{background:var(--team-red)}

/* hit flash */
#dmg{position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(220,38,38,.55));opacity:0;transition:opacity .25s}

/* bottom-left: joystick */
#stick{
  position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
  width:104px;height:104px;border-radius:50%;
  background:rgba(255,255,255,.20);border:2px solid rgba(255,255,255,.42);
  backdrop-filter:blur(3px);
}
#knob{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);
  box-shadow:0 3px 10px rgba(0,0,0,.3);
}

/* bottom-right: buttons */
#pad{
  position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,auto);gap:9px;align-items:end;
}
.pb{
  width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.2);backdrop-filter:blur(3px);
  color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .08s;text-shadow:0 1px 4px rgba(0,0,0,.5);
}
.pb:active{transform:scale(.9);background:rgba(255,255,255,.4)}
.pb.fire{width:70px;height:70px;font-size:26px;background:rgba(255,140,66,.55);border-color:rgba(255,255,255,.65)}
.pb.sm{width:42px;height:42px;font-size:16px}

/* bottom-center: health + ammo */
.vitals{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.9);border-radius:13px;padding:8px 14px;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
}
.hpwrap{width:120px}
.hpwrap .lbl{display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:#888;margin-bottom:3px}
.hpbar{height:7px;border-radius:4px;background:#EEE;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#10B981,#34D399);transition:width .2s}
.hpbar i.low{background:linear-gradient(90deg,#EF4444,#F87171)}
.ammo{display:flex;align-items:baseline;gap:3px;font-weight:800;color:#333}
.ammo b{font-size:19px} .ammo span{font-size:11px;color:#aaa}
.gunname{font-size:8.5px;color:#999;font-weight:600;letter-spacing:.5px}

/* pause / end overlay */
.sheet-ov{
  position:fixed;inset:0;background:rgba(15,10,6,.72);z-index:800;
  display:none;align-items:center;justify-content:center;padding:24px;
}
.sheet-ov.open{display:flex}
.panel{
  background:#FDFBF7;border-radius:20px;padding:22px;width:100%;max-width:340px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.panel h3{font-size:16px;font-weight:800;color:#333;margin-bottom:5px}
.panel p{font-size:11px;color:#888;margin-bottom:16px}
.pbtn{
  width:100%;border:none;border-radius:12px;padding:12px;font-size:12.5px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;
}
.pbtn+.pbtn{margin-top:8px}
.pbtn.primary{background:var(--gradient-orange);color:#fff}
.pbtn.ghost{background:#FFF0E6;color:var(--orange-main)}
.pbtn.out{background:transparent;color:#888;border:1.5px solid #e5e5e5}

/* desktop hint */
#dhint{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(52px + env(safe-area-inset-top));
  background:rgba(0,0,0,.5);color:#fff;font-size:9.5px;font-weight:600;
  padding:5px 11px;border-radius:8px;transition:opacity .5s;
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>
</div>

<div id="rotate">
  <i class="ri-smartphone-line"></i>
  <h2>Rotate your device</h2>
  <p>2D Shooter matches are played in landscape. Turn your phone sideways to deploy.</p>
</div>

<div id="hud">
  <div class="top">
    <div class="score">
      <div><b class="blue" id="scoreA">0</b><small>YOU</small></div>
      <div><span class="clock" id="clock">5:00</span><small>TARGET <span id="target">20</span></small></div>
      <div><b class="red" id="scoreB">0</b><small>ENEMY</small></div>
    </div>
  </div>
  <div class="top-right">
    <button class="sq hb" id="pauseBtn"><i class="ri-pause-fill"></i></button>
  </div>

  <canvas id="mini" width="152" height="152"></canvas>
  <div id="feed"></div>
  <div id="cross"></div>
  <div id="dmg"></div>
  <div id="dhint">WASD move · Mouse look · Click fire · R reload</div>

  <div id="stick" class="hb"><div id="knob"></div></div>

  <div class="vitals">
    <div class="hpwrap">
      <div class="lbl"><span id="gunName">AK-47</span><span id="hpTxt">100/100</span></div>
      <div class="hpbar"><i id="hpFill" style="width:100%"></i></div>
    </div>
    <div>
      <div class="ammo"><b id="ammoNow">30</b><span>/<span id="ammoMax">30</span></span></div>
      <div class="gunname" id="reloadTxt">READY</div>
    </div>
  </div>

  <div id="pad">
    <div style="display:flex;flex-direction:column;gap:9px">
      <div class="pb sm hb" id="btnMelee"><i class="ri-knife-blood-fill"></i></div>
      <div class="pb sm hb" id="btnNade"><i class="ri-bomb-fill"></i></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <div class="pb hb" id="btnReload"><i class="ri-loop-right-fill"></i></div>
      <div class="pb hb" id="btnSprint"><i class="ri-run-fill"></i></div>
    </div>
    <div class="pb fire hb" id="btnFire"><i class="ri-crosshair-2-fill"></i></div>
  </div>
</div>

<div class="sheet-ov" id="pauseOv">
  <div class="panel">
    <h3>Match Paused</h3>
    <p id="pauseSub">Team Deathmatch · Warehouse</p>
    <button class="pbtn primary" id="resumeBtn"><i class="ri-play-fill"></i> Resume Match</button>
    <button class="pbtn ghost" id="settingsBtn"><i class="ri-settings-3-line"></i> Settings</button>
    <button class="pbtn out" id="quitBtn"><i class="ri-logout-box-line"></i> Forfeit & Leave</button>
  </div>
</div>

<script src="assets/maps.js"></script>
<script src="assets/net.js"></script>
<script src="assets/game.js"></script>
<script>
/* ==========================================================
   MATCH — lightweight raycast 3D engine
   ========================================================== */
const M = TVG.state.match;
if (!M || !M.roster) location.replace('match-type.html');
const MAPDEF = TVG.map(M.map);
const GUN = TVG.weapon(TVG.state.equipped.primary);
pauseSub.textContent = M.gameMode + ' · ' + MAPDEF.name;
gunName.textContent = GUN.name;

/* ---------- WORLD ---------- */
const S = TVGMaps.size();
const grid = TVGMaps.toGrid(M.map);
const MAT  = TVGMaps.material(M.map);
const solid = (x,y) => x<0||y<0||x>=S||y>=S || grid[y|0][x|0] > 0;

function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const C1 = hex2rgb(MAPDEF.c1), C2 = hex2rgb(MAPDEF.c2);
const WALLS = [null, C1, C2,
  [Math.round((C1[0]+C2[0])/2), Math.round((C1[1]+C2[1])/2), Math.round((C1[2]+C2[2])/2)]];

/* per-material surface description drives the wall texturing */
const SURFACE = {
  metal:     { courses: 3,  joint:.010, vseam:.50, rough:.05, spec:.10 },  // panel seams
  concrete:  { courses: 2,  joint:.008, vseam:.00, rough:.10, spec:.04 },  // poured slabs
  adobe:     { courses: 5,  joint:.016, vseam:.50, rough:.14, spec:.02 },  // mud brick
  container: { courses: 0,  joint:0,    vseam:.14, rough:.04, spec:.13 },  // corrugated ribs
  stone:     { courses: 4,  joint:.020, vseam:.33, rough:.18, spec:.03 },  // rough masonry
  steel:     { courses: 2,  joint:.012, vseam:.25, rough:.06, spec:.16 }   // riveted plate
}[MAT] || { courses:3, joint:.012, vseam:.5, rough:.08, spec:.06 };

/* cheap deterministic noise for surface mottling */
function surfNoise(mx, my, wx) {
  const n = Math.sin(mx*12.9898 + my*78.233 + wx*37.719) * 43758.5453;
  return (n - Math.floor(n)) - 0.5;
}

/* ---------- ENTITIES ---------- */
const NET = !!(M.net && M.net.matchId);
const MYNAME = NET ? M.net.you : TVG.state.player.name;
const MYTEAM = NET ? M.net.team : 'A';

const spawnPt = TVGMaps.spawn(M.map, MYTEAM);
const player = {
  x: spawnPt.x, y: spawnPt.y, a: MYTEAM === 'A' ? -0.8 : 2.4,
  hp: 100, ammo: GUN.ammo, kills: 0, deaths: 0, hs: 0,
  shots: 0, hits: 0, reloading: false
};

const TARGET = NET ? M.net.target : (M.size === 1 ? 15 : M.size === 2 ? 25 : 40);
target.textContent = TARGET;
ammoMax.textContent = GUN.ammo;
ammoNow.textContent = player.ammo;

/* every other combatant, whether a remote human or a server bot */
let actors = [];            // {name, team, x, y, a, hp, dead}
const actorMap = new Map();

function seedActors() {
  const rosterA = NET ? M.net.teamA.map(x => x.name) : M.teamA;
  const rosterB = NET ? M.net.teamB.map(x => x.name) : M.teamB;
  [['A', rosterA], ['B', rosterB]].forEach(([team, names]) => {
    names.forEach(n => {
      if (n === MYNAME) return;
      const sp = TVGMaps.spawn(M.map, team);
      const e = { name:n, team, x: sp.x + (Math.random()-.5), y: sp.y + (Math.random()-.5),
                  a:0, hp:100, dead:false, cd: .8+Math.random(), dir: Math.random()*6.28,
                  respawn:0 };
      actors.push(e); actorMap.set(n, e);
    });
  });
}
seedActors();

const foes = () => actors.filter(e => !e.dead && e.team !== MYTEAM);
let scoreA = 0, scoreB = 0, time = NET ? M.net.duration : 300;
let running = true, ended = false;

const myScore = () => MYTEAM === 'A' ? scoreA : scoreB;
const foeScore = () => MYTEAM === 'A' ? scoreB : scoreA;

/* ---------- CANVAS ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mc = document.getElementById('mini'), mctx = mc.getContext('2d');
let W = 0, H = 0, RES = 2;
function resize() {
  const q = TVG.state.settings.graphics;
  RES = q === 'high' ? 1 : q === 'low' ? 3 : 2;
  W = Math.floor(window.innerWidth / RES);
  H = Math.floor(window.innerHeight / RES);
  cv.width = W; cv.height = H;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize); resize();

/* ---------- RENDER ---------- */
const FOV = Math.PI / 3;
let zbuf = new Float32Array(2048);
let bob = 0, recoil = 0;

function shade(c, k) {
  return 'rgb(' + (c[0]*k|0) + ',' + (c[1]*k|0) + ',' + (c[2]*k|0) + ')';
}

/* --- depth-shaded floor & sky, drawn once per frame --- */
function drawBackdrop(horizon) {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#3E5A78');
  sky.addColorStop(0.55, '#8FA6B8');
  sky.addColorStop(0.86, '#E8B98A');
  sky.addColorStop(1, '#FFD9AE');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, Math.max(0, horizon));

  // sun glow anchored to view direction
  const sunA = 0.9;
  let da = sunA - player.a;
  while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283;
  if (Math.abs(da) < 1.4) {
    const sx = W/2 + (Math.tan(da) / Math.tan(FOV/2)) * (W/2);
    const g = ctx.createRadialGradient(sx, horizon - H*0.16, 0, sx, horizon - H*0.16, H*0.42);
    g.addColorStop(0, 'rgba(255,236,196,.85)');
    g.addColorStop(0.35, 'rgba(255,196,130,.28)');
    g.addColorStop(1, 'rgba(255,180,110,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizon);
  }

  // floor: per-row distance shading (real depth falloff)
  const fb = [58, 44, 33];
  const rows = H - Math.max(0, horizon);
  for (let i = 0; i < rows; i++) {
    const y = horizon + i;
    if (y < 0) continue;
    const d = (H * 0.5) / (i + 0.6);            // world distance for this row
    const fog = Math.max(0.16, Math.min(1, 1.35 - d / 13));
    // faint concentric depth banding = perspective cue
    const band = (d % 1 < 0.06) ? 0.86 : 1;
    ctx.fillStyle = shade(fb, fog * band * 1.5);
    ctx.fillRect(0, y, W, 1);
  }
}

function render() {
  const horizon = H/2 + recoil + Math.sin(bob)*2;
  drawBackdrop(horizon);

  for (let col = 0; col < W; col++) {
    const camX = 2*col/W - 1;
    const ra = player.a + Math.atan(camX * Math.tan(FOV/2));
    const dx = Math.cos(ra), dy = Math.sin(ra);
    let mx = player.x|0, my = player.y|0;
    const ddx = Math.abs(1/dx), ddy = Math.abs(1/dy);
    let sx, sy, sdx, sdy;
    if (dx < 0){ sx=-1; sdx=(player.x-mx)*ddx; } else { sx=1; sdx=(mx+1-player.x)*ddx; }
    if (dy < 0){ sy=-1; sdy=(player.y-my)*ddy; } else { sy=1; sdy=(my+1-player.y)*ddy; }
    let side = 0, hit = 0, guard = 0;
    while (!hit && guard++ < 90) {
      if (sdx < sdy){ sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
      if (mx<0||my<0||mx>=S||my>=S) { hit = 1; break; }
      if (grid[my][mx] > 0) hit = grid[my][mx];
    }
    const dist = side === 0 ? (sdx - ddx) : (sdy - ddy);
    const perp = Math.max(0.05, dist * Math.cos(ra - player.a));
    zbuf[col] = perp;

    // where along the wall face did we hit? (texture coordinate)
    let wallX = side === 0 ? player.y + perp*dy : player.x + perp*dx;
    wallX -= Math.floor(wallX);

    const lh = H / perp;
    const y0 = horizon - lh/2, y1 = horizon + lh/2;
    const c = WALLS[hit] || WALLS[1];

    // lighting: face orientation + distance fog + muzzle flash bounce
    const fog = Math.max(0.16, 1 - perp/15);
    let k = (side === 1 ? 0.62 : 1) * fog;
    if (muzzle > 0.05) k += muzzle * 0.5 * Math.max(0, 1 - perp/6);

    ctx.fillStyle = shade(c, k);
    ctx.fillRect(col, y0, 1, y1 - y0);

    // --- material surface: courses, seams, corrugation, mottling ---
    if (SURFACE.rough) {
      k *= 1 + surfNoise(mx, my, Math.floor(wallX*24)) * SURFACE.rough;
      ctx.fillStyle = shade(c, k);
      ctx.fillRect(col, y0, 1, y1 - y0);
    }
    const courses = SURFACE.courses;
    if (courses && lh / courses > 2) {
      const ch = lh / courses;
      ctx.fillStyle = shade(c, k * 0.58);
      for (let r = 1; r < courses; r++) {
        ctx.fillRect(col, y0 + ch*r, 1, Math.max(1, lh * SURFACE.joint * 1.6));
      }
      if (SURFACE.vseam) {
        for (let r = 0; r < courses; r++) {
          const off = (r % 2) * (SURFACE.vseam / 2);
          if (((wallX + off) % SURFACE.vseam) < SURFACE.joint * 2.4) {
            ctx.fillRect(col, y0 + ch*r, 1, ch);
          }
        }
      }
    } else if (SURFACE.vseam) {
      // corrugated / ribbed panels: vertical only, shaded like a cylinder
      const ph = (wallX % SURFACE.vseam) / SURFACE.vseam;
      const rib = 0.80 + 0.28 * Math.sin(ph * Math.PI * 2);
      ctx.fillStyle = shade(c, k * rib);
      ctx.fillRect(col, y0, 1, y1 - y0);
    }

    // --- ambient occlusion: darker at base and where wall meets ceiling ---
    const aoH = lh * 0.22;
    let ag = ctx.createLinearGradient(0, y1 - aoH, 0, y1);
    ag.addColorStop(0, 'rgba(0,0,0,0)'); ag.addColorStop(1, 'rgba(0,0,0,.42)');
    ctx.fillStyle = ag; ctx.fillRect(col, y1 - aoH, 1, aoH);

    ag = ctx.createLinearGradient(0, y0, 0, y0 + lh*0.16);
    ag.addColorStop(0, 'rgba(0,0,0,.3)'); ag.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ag; ctx.fillRect(col, y0, 1, lh*0.16);

    // --- specular grazing highlight on the lit face ---
    if (SURFACE.spec > .02 && side === 0 && wallX > 0.40 && wallX < 0.60) {
      ctx.fillStyle = 'rgba(255,240,220,' + (SURFACE.spec * fog) + ')';
      ctx.fillRect(col, y0, 1, y1 - y0);
    }
  }

  drawSprites(horizon);
  drawGun();
  drawVignette();
}

function drawSprites(horizon) {
  const list = actors.filter(e => !e.dead)
    .map(e => ({ e, d: (e.x-player.x)**2 + (e.y-player.y)**2 }))
    .sort((a,b) => b.d - a.d);

  for (const {e, d} of list) {
    const sx = e.x - player.x, sy = e.y - player.y;
    let ang = Math.atan2(sy, sx) - player.a;
    while (ang > Math.PI) ang -= 2*Math.PI;
    while (ang < -Math.PI) ang += 2*Math.PI;
    if (Math.abs(ang) > FOV/2 + 0.4) continue;
    const dist = Math.sqrt(d);
    if (dist < 0.25) continue;

    const screenX = W/2 + (Math.tan(ang) / Math.tan(FOV/2)) * (W/2);
    const sz = H / dist;
    const bw = sz * 0.34;
    const feet = horizon + sz/2;
    const bh = sz * 0.80;
    const top = feet - bh;
    if (screenX + bw < 0 || screenX - bw > W) continue;

    const cc = Math.max(0, Math.min(W-1, screenX|0));
    if (zbuf[cc] < dist - 0.3) continue;

    const fog = Math.max(0.24, 1 - dist/15);
    const hostile = e.team !== MYTEAM;
    const base = hostile ? [214,58,58] : [48,110,222];
    const lit  = hostile ? [255,126,110] : [122,176,255];

    // contact shadow on the floor — grounds the figure
    ctx.save();
    ctx.globalAlpha = 0.42 * fog;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(screenX, feet, bw*0.85, bw*0.26, 0, 0, 6.3);
    ctx.fill();
    ctx.restore();

    // legs
    const lw = bw*0.30;
    ctx.fillStyle = shade([30,30,34], fog);
    ctx.fillRect(screenX - bw*0.42, feet - bh*0.34, lw, bh*0.34);
    ctx.fillRect(screenX + bw*0.12, feet - bh*0.34, lw, bh*0.34);

    // torso with vertical light falloff
    const tg = ctx.createLinearGradient(0, top + bh*0.24, 0, feet - bh*0.30);
    tg.addColorStop(0, shade(lit, fog));
    tg.addColorStop(0.45, shade(base, fog));
    tg.addColorStop(1, shade(base, fog*0.55));
    ctx.fillStyle = tg;
    ctx.fillRect(screenX - bw*0.5, top + bh*0.24, bw, bh*0.48);

    // plate carrier
    ctx.fillStyle = shade(base, fog*0.45);
    ctx.fillRect(screenX - bw*0.38, top + bh*0.34, bw*0.76, bh*0.26);

    // shoulders
    ctx.fillStyle = shade(lit, fog*0.85);
    ctx.fillRect(screenX - bw*0.58, top + bh*0.26, bw*0.16, bh*0.20);
    ctx.fillRect(screenX + bw*0.42, top + bh*0.26, bw*0.16, bh*0.20);

    // head + helmet
    const hr = bw*0.26;
    ctx.fillStyle = shade([206,158,120], fog);
    ctx.beginPath(); ctx.arc(screenX, top + bh*0.16, hr, 0, 6.3); ctx.fill();
    ctx.fillStyle = shade(base, fog*0.8);
    ctx.beginPath(); ctx.arc(screenX, top + bh*0.13, hr*1.12, Math.PI, 0); ctx.fill();
    // visor glint
    ctx.fillStyle = 'rgba(180,225,255,' + (0.55*fog) + ')';
    ctx.fillRect(screenX - hr*0.8, top + bh*0.15, hr*1.6, hr*0.42);

    // rifle
    ctx.fillStyle = shade([26,24,22], fog);
    ctx.fillRect(screenX - bw*0.1, top + bh*0.44, bw*0.95, bh*0.06);

    // rim light from the sky
    ctx.fillStyle = 'rgba(255,215,170,' + (0.16*fog) + ')';
    ctx.fillRect(screenX - bw*0.5, top + bh*0.24, bw*0.07, bh*0.48);

    if (e.hp < 100) {
      const bwid = bw*1.1;
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(screenX - bwid/2, top - 7, bwid, 4);
      ctx.fillStyle = e.hp > 50 ? '#4ADE80' : '#FBBF24';
      ctx.fillRect(screenX - bwid/2, top - 7, bwid * e.hp/100, 4);
    }
  }
}

function drawVignette() {
  const g = ctx.createRadialGradient(W/2, H/2, H*0.32, W/2, H/2, H*0.82);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (player.hp < 40) {
    const r = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.75);
    const a = (40 - player.hp)/40 * 0.5;
    r.addColorStop(0, 'rgba(180,20,20,0)');
    r.addColorStop(1, 'rgba(180,20,20,' + a + ')');
    ctx.fillStyle = r; ctx.fillRect(0,0,W,H);
  }
}

/* ---------- FIRST-PERSON WEAPON ---------- */
let muzzle = 0;
function drawGun() {
  const s = H/300;
  const gx = W*0.70 + Math.sin(bob)*W*0.007;
  const gy = H + Math.abs(Math.cos(bob))*H*0.014 + recoil*2.2;
  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(-0.06);

  const metal = ctx.createLinearGradient(0, -58*s, 0, -34*s);
  metal.addColorStop(0, '#5A6067'); metal.addColorStop(.28, '#33383D');
  metal.addColorStop(.6, '#212528'); metal.addColorStop(1, '#131618');

  const poly = ctx.createLinearGradient(0, -40*s, 0, -6*s);
  poly.addColorStop(0, '#3C4147'); poly.addColorStop(1, '#15181B');

  // barrel + suppressor
  ctx.fillStyle = metal;
  ctx.fillRect(-96*s, -49*s, 34*s, 9*s);
  ctx.fillStyle = '#1A1D20';
  ctx.fillRect(-122*s, -52*s, 28*s, 15*s);
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.fillRect(-122*s, -52*s, 28*s, 3*s);

  // handguard with vents
  ctx.fillStyle = poly;
  ctx.fillRect(-70*s, -52*s, 34*s, 16*s);
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  for (let i = 0; i < 4; i++) ctx.fillRect((-66 + i*8)*s, -48*s, 4*s, 8*s);

  // receiver
  ctx.fillStyle = metal;
  ctx.fillRect(-40*s, -56*s, 58*s, 20*s);
  ctx.fillStyle = 'rgba(255,255,255,.13)';
  ctx.fillRect(-40*s, -56*s, 58*s, 2.5*s);

  // top rail
  ctx.fillStyle = '#26292D';
  ctx.fillRect(-74*s, -60*s, 84*s, 5*s);
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  for (let i = 0; i < 11; i++) ctx.fillRect((-72 + i*7)*s, -59*s, 3*s, 3*s);

  // rear sight
  ctx.fillStyle = '#2E3236';
  ctx.fillRect(-4*s, -68*s, 8*s, 9*s);

  // magazine
  ctx.fillStyle = poly;
  ctx.beginPath();
  ctx.moveTo(-28*s, -36*s); ctx.lineTo(-8*s, -36*s);
  ctx.lineTo(-2*s, -2*s);  ctx.lineTo(-26*s, -2*s);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.fillRect(-26*s, -34*s, 4*s, 30*s);

  // grip + hand
  ctx.fillStyle = poly;
  ctx.beginPath();
  ctx.moveTo(6*s, -36*s); ctx.lineTo(26*s, -36*s);
  ctx.lineTo(20*s, 10*s); ctx.lineTo(2*s, 10*s);
  ctx.closePath(); ctx.fill();
  const skin = ctx.createLinearGradient(0, -30*s, 0, 4*s);
  skin.addColorStop(0, '#C08E64'); skin.addColorStop(1, '#7E5636');
  ctx.fillStyle = skin;
  ctx.fillRect(2*s, -30*s, 24*s, 30*s);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  for (let i = 0; i < 3; i++) ctx.fillRect(4*s, (-24 + i*8)*s, 20*s, 2*s);

  // support hand on handguard
  ctx.fillStyle = skin;
  ctx.fillRect(-64*s, -40*s, 22*s, 22*s);
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(-64*s, -34*s, 22*s, 2.5*s);

  // muzzle flash
  if (muzzle > 0) {
    ctx.globalAlpha = muzzle;
    const fg = ctx.createRadialGradient(-126*s, -45*s, 0, -126*s, -45*s, 26*s);
    fg.addColorStop(0, '#FFF6D8'); fg.addColorStop(.35, '#FFC559');
    fg.addColorStop(.7, 'rgba(255,124,32,.55)'); fg.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(-126*s, -45*s, 26*s*(0.6+muzzle*0.6), 0, 6.3); ctx.fill();
    // star spikes
    ctx.strokeStyle = 'rgba(255,224,150,' + muzzle + ')';
    ctx.lineWidth = 2.4*s;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.256 + muzzle;
      ctx.beginPath();
      ctx.moveTo(-126*s, -45*s);
      ctx.lineTo(-126*s + Math.cos(a)*30*s*muzzle, -45*s + Math.sin(a)*30*s*muzzle);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------- MINIMAP ---------- */
function drawMini() {
  const s = 152/S;
  mctx.clearRect(0,0,152,152);
  mctx.fillStyle = 'rgba(255,255,255,.65)'; mctx.fillRect(0,0,152,152);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++) if (grid[y][x]>0) {
    mctx.fillStyle = 'rgba(120,100,85,.85)'; mctx.fillRect(x*s, y*s, s, s);
  }
  actors.forEach(e => {
    if (e.dead || e.x === undefined) return;
    if (e.team === MYTEAM) { mctx.fillStyle='#3B82F6'; dot(e.x*s,e.y*s,2.6); }
    else if (Math.hypot(e.x-player.x,e.y-player.y) < 9) { mctx.fillStyle='#EF4444'; dot(e.x*s,e.y*s,2.6); }
  });
  mctx.fillStyle = '#FF8C42'; dot(player.x*s, player.y*s, 3.4);
  mctx.strokeStyle = '#FF8C42'; mctx.lineWidth = 1.6;
  mctx.beginPath(); mctx.moveTo(player.x*s, player.y*s);
  mctx.lineTo(player.x*s + Math.cos(player.a)*9, player.y*s + Math.sin(player.a)*9); mctx.stroke();
  function dot(x,y,r){ mctx.beginPath(); mctx.arc(x,y,r,0,6.3); mctx.fill(); }
}

/* ---------- INPUT ---------- */
let mv = {x:0, y:0}, look = 0, sprint = false, firing = false;
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') reload();
  if (e.code === 'Escape') togglePause();
  if (e.code === 'ShiftLeft') sprint = true;
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code==='ShiftLeft') sprint = false; });

cv.addEventListener('click', () => {
  if (!running) return;
  if (!document.pointerLockElement && matchMedia('(pointer:fine)').matches) cv.requestPointerLock();
  else fire();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement === cv) player.a += e.movementX * 0.0022 * (TVG.state.settings.sensitivity/55);
});
addEventListener('mousedown', e => { if (document.pointerLockElement === cv) firing = true; });
addEventListener('mouseup', () => firing = false);

/* joystick */
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null;
function stickMove(t) {
  const r = stick.getBoundingClientRect();
  let dx = t.clientX - (r.left + r.width/2), dy = t.clientY - (r.top + r.height/2);
  const d = Math.hypot(dx, dy), max = r.width/2 - 8;
  if (d > max) { dx = dx/d*max; dy = dy/d*max; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  mv.x = dx/max; mv.y = dy/max;
}
stick.addEventListener('touchstart', e => { stickId = e.changedTouches[0].identifier; stickMove(e.changedTouches[0]); e.preventDefault(); }, {passive:false});
stick.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) if (t.identifier === stickId) stickMove(t);
  e.preventDefault();
}, {passive:false});
stick.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === stickId) {
    stickId = null; mv.x = mv.y = 0; knob.style.transform = 'translate(-50%,-50%)';
  }
});

/* look drag on right half */
let lookId = null, lastLX = 0;
cv.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) if (t.clientX > innerWidth*0.4 && lookId === null) { lookId = t.identifier; lastLX = t.clientX; }
}, {passive:true});
cv.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) if (t.identifier === lookId) {
    player.a += (t.clientX - lastLX) * 0.0055 * (TVG.state.settings.sensitivity/55);
    lastLX = t.clientX;
  }
}, {passive:true});
cv.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
});

/* buttons */
function hold(el, on, off) {
  el.addEventListener('touchstart', e => { e.preventDefault(); on(); }, {passive:false});
  el.addEventListener('touchend', e => { e.preventDefault(); off && off(); }, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', () => off && off());
  el.addEventListener('mouseleave', () => off && off());
}
hold(btnFire, () => firing = true, () => firing = false);
hold(btnSprint, () => sprint = true, () => sprint = false);
btnReload.addEventListener('click', reload);
btnNade.addEventListener('click', throwNade);
btnMelee.addEventListener('click', melee);
pauseBtn.onclick = togglePause;
resumeBtn.onclick = togglePause;
settingsBtn.onclick = () => location.href = 'game-settings.html';
quitBtn.onclick = () => endMatch(true);

/* ---------- COMBAT ---------- */
let fireCd = 0, nadeCd = 0, meleeCd = 0;

function fire() {
  if (!running || player.reloading || fireCd > 0) return;
  if (player.ammo <= 0) { reload(); return; }
  player.ammo--; player.shots++;
  fireCd = Math.max(0.07, 1.1 - GUN.fire/100);
  muzzle = 1; recoil = -3;
  updateHud();

  let best = null, bestD = 99;
  for (const e of foes()) {
    const dx = e.x-player.x, dy = e.y-player.y;
    let ang = Math.atan2(dy,dx) - player.a;
    while (ang > Math.PI) ang -= 6.283; while (ang < -Math.PI) ang += 6.283;
    const dist = Math.hypot(dx,dy);
    if (Math.abs(ang) < Math.atan2(0.45, dist) && dist < bestD && losClear(e)) { best = e; bestD = dist; }
  }

  let dmg = 0;
  if (best) {
    player.hits++;
    const head = Math.random() < 0.22;
    const falloff = Math.max(0.45, 1 - bestD/(GUN.range/4));
    dmg = Math.round(GUN.dmg * falloff * (head ? 1.9 : 1) * 0.55);
    cross.classList.add('hit'); setTimeout(()=>cross.classList.remove('hit'), 120);
    if (head) TVG.bumpMission('d4', 1);
    if (!NET) {                       // offline: resolve locally
      best.hp -= dmg;
      if (best.hp <= 0) localKill(best, head);
    }
  }
  if (NET) TVGNet.send('shoot', { target: best ? best.name : null, dmg });
}

function losClear(e) {
  const steps = 24, dx = (e.x-player.x)/steps, dy = (e.y-player.y)/steps;
  for (let i=1;i<steps;i++) if (solid(player.x+dx*i, player.y+dy*i)) return false;
  return true;
}

function localKill(e, head) {
  e.dead = true; e.respawn = 4 + Math.random()*3;
  player.kills++; if (head) player.hs++;
  if (MYTEAM === 'A') scoreA++; else scoreB++;
  updateHud();
  feedAdd(MYNAME, e.name, head);
  TVG.bumpMission('d2', 1); TVG.bumpMission('w2', 1);
  if (myScore() >= TARGET) endMatch();
}

function reload() {
  if (player.reloading || player.ammo === GUN.ammo || !running) return;
  player.reloading = true; reloadTxt.textContent = 'RELOADING';
  setTimeout(() => {
    player.ammo = GUN.ammo; player.reloading = false;
    reloadTxt.textContent = 'READY'; updateHud();
  }, 1500);
}

function throwNade() {
  if (nadeCd > 0 || !running) return;
  nadeCd = 8;
  const g = TVG.weapon(TVG.state.equipped.grenade);
  setTimeout(() => {
    const tx = player.x + Math.cos(player.a)*5, ty = player.y + Math.sin(player.a)*5;
    let got = 0;
    foes().forEach(e => {
      if (Math.hypot(e.x-tx, e.y-ty) < 2.6) {
        if (NET) TVGNet.send('shoot', { target: e.name, dmg: 70 });
        else { e.hp -= 70; if (e.hp <= 0) { localKill(e,false); got++; } }
      }
    });
    TVG.toast(g.name + (got ? ' — ' + got + ' down!' : ' thrown'), got ? 'success' : 'info');
  }, 900);
}

function melee() {
  if (meleeCd > 0 || !running) return;
  meleeCd = 1.2;
  const mw = TVG.weapon(TVG.state.equipped.melee);
  for (const e of foes()) {
    if (Math.hypot(e.x-player.x, e.y-player.y) < 1.5) {
      if (NET) TVGNet.send('shoot', { target: e.name, dmg: mw.dmg });
      else { e.hp -= mw.dmg; if (e.hp<=0) localKill(e,false); }
      break;
    }
  }
}

function hurt(n) {
  player.hp -= n;
  dmg.style.opacity = .9; setTimeout(()=> dmg.style.opacity = 0, 180);
  if (navigator.vibrate && TVG.state.settings.vibration) navigator.vibrate(30);
  if (player.hp <= 0 && !NET) {
    player.deaths++;
    if (MYTEAM === 'A') scoreB++; else scoreA++;
    feedAdd(TVG.pick(M.teamB), MYNAME, false);
    respawnMe();
    if (foeScore() >= TARGET) endMatch();
  }
  updateHud();
}

function respawnMe() {
  const sp = TVGMaps.spawn(M.map, MYTEAM);
  player.hp = 100; player.ammo = GUN.ammo;
  player.x = sp.x + (Math.random()-.5); player.y = sp.y + (Math.random()-.5);
}

function feedAdd(a, b, head) {
  const el = document.createElement('div');
  el.className = 'kf';
  el.innerHTML = `<span>${a}</span><i class="${head?'ri-focus-3-line':'ri-crosshair-2-fill'}"></i><span style="opacity:.7">${b}</span>`;
  feed.prepend(el);
  while (feed.children.length > 4) feed.lastChild.remove();
  setTimeout(() => el.remove(), 4500);
}

/* ---------- LOCAL BOT AI (offline fallback only) ---------- */
function stepBot(e, dt) {
  if (e.dead) {
    e.respawn -= dt;
    if (e.respawn <= 0) {
      const sp = TVGMaps.spawn(M.map, e.team);
      e.x = sp.x + (Math.random()-.5); e.y = sp.y + (Math.random()-.5);
      e.hp = 100; e.dead = false;
    }
    return;
  }
  const hostile = e.team !== MYTEAM;
  const d = Math.hypot(player.x-e.x, player.y-e.y);
  const see = d < 11 && losClear(e);
  let ang;
  if (see && hostile) {
    e.a = Math.atan2(player.y-e.y, player.x-e.x);
    ang = e.a + (d < 3.5 ? Math.PI : (Math.random()-0.5)*0.9);
  } else {
    if (Math.random() < 0.02) e.dir = Math.random()*6.283;
    ang = e.dir; e.a = ang;
  }
  const sp = 1.5*dt;
  const nx = e.x + Math.cos(ang)*sp, ny = e.y + Math.sin(ang)*sp;
  if (!solid(nx, e.y)) e.x = nx; else e.dir = Math.random()*6.283;
  if (!solid(e.x, ny)) e.y = ny; else e.dir = Math.random()*6.283;

  e.cd -= dt;
  if (e.cd <= 0) {
    e.cd = 0.9 + Math.random()*1.6;
    if (hostile && see) {
      if (Math.random() < 0.55 - Math.min(0.3, d/40)) hurt(TVG.rnd(7, 16));
    } else if (!hostile) {
      const alive = foes();
      if (alive.length && Math.random() < 0.20) {
        const t = TVG.pick(alive);
        t.hp -= 45;
        if (t.hp <= 0) {
          t.dead = true; t.respawn = 4+Math.random()*3;
          if (MYTEAM === 'A') scoreA++; else scoreB++;
          feedAdd(e.name, t.name, false); updateHud();
          if (myScore() >= TARGET) endMatch();
        }
      }
    }
  }
}

let tradeCd = 3;
function enemyTrades(dt) {
  tradeCd -= dt;
  if (tradeCd > 0) return;
  tradeCd = 3 + Math.random()*4;
  if (Math.random() < 0.55) {
    if (MYTEAM === 'A') scoreB++; else scoreA++;
    feedAdd(TVG.pick(M.teamB), TVG.pick(M.teamA) || 'Ally', false);
    updateHud();
    if (foeScore() >= TARGET) endMatch();
  }
}

/* ---------- NETWORK BINDINGS ---------- */
if (NET) {
  TVGNet.on('state', d => {
    d.ents.forEach(e => {
      if (e.n === MYNAME) {
        if (player.hp !== e.h) { player.hp = e.h; updateHud(); }
        return;
      }
      let a = actorMap.get(e.n);
      if (!a) { a = { name:e.n, team:e.t }; actors.push(a); actorMap.set(e.n, a); }
      a.tx = e.x; a.ty = e.y;           // interpolation targets
      if (a.x === undefined) { a.x = e.x; a.y = e.y; }
      a.a = e.a; a.hp = e.h; a.dead = !!e.d; a.team = e.t;
    });
    scoreA = d.score.A; scoreB = d.score.B;
    time = d.left;
    updateHud();
  });

  TVGNet.on('hit', d => {
    if (d.name !== MYNAME) return;
    const before = player.hp;
    player.hp = d.hp;
    if (player.hp < before) {
      dmg.style.opacity = .9; setTimeout(()=> dmg.style.opacity = 0, 180);
      if (navigator.vibrate && TVG.state.settings.vibration) navigator.vibrate(30);
    }
    updateHud();
  });

  TVGNet.on('kill', d => {
    feedAdd(d.killer, d.victim, false);
    if (d.killer === MYNAME) {
      player.kills = d.kills;
      TVG.bumpMission('d2', 1); TVG.bumpMission('w2', 1);
    }
    if (d.victim === MYNAME) player.deaths++;
    scoreA = d.score.A; scoreB = d.score.B;
    updateHud();
  });

  TVGNet.on('respawn', d => {
    if (d.name === MYNAME) { player.x = d.x; player.y = d.y; player.hp = 100; player.ammo = GUN.ammo; updateHud(); }
  });

  TVGNet.on('playerLeft', d => {
    TVG.toast(d.name + (d.toBot ? ' disconnected — AI took over' : ' left the match'), 'info');
  });

  // the socket is re-opened on this page, so the server hands our body back
  TVGNet.on('rejoin', d => {
    scoreA = d.score.A; scoreB = d.score.B; time = d.left;
    updateHud();
  });

  TVGNet.on('matchEnd', d => finishFromServer(d));
  TVGNet.on('close', () => { if (!ended) TVG.toast('Lost connection to server', 'error'); });

  // stream our position at 20 Hz
  setInterval(() => {
    if (!running || ended) return;
    TVGNet.send('move', { x: +player.x.toFixed(2), y: +player.y.toFixed(2), a: +player.a.toFixed(2) });
  }, 50);

  TVGNet.connect(TVG.state.player.name);
}

/* ---------- HUD ---------- */
function updateHud() {
  document.getElementById('scoreA').textContent = myScore();
  document.getElementById('scoreB').textContent = foeScore();
  ammoNow.textContent = player.ammo;
  hpTxt.textContent = Math.max(0, player.hp) + '/100';
  hpFill.style.width = Math.max(0, player.hp) + '%';
  hpFill.className = player.hp < 35 ? 'low' : '';
}
updateHud();

/* ---------- LOOP ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running) {
    let kx = 0, ky = 0;
    if (keys.KeyW || keys.ArrowUp) ky -= 1;
    if (keys.KeyS || keys.ArrowDown) ky += 1;
    if (keys.KeyA) kx -= 1;
    if (keys.KeyD) kx += 1;
    if (keys.ArrowLeft) player.a -= 2.2*dt;
    if (keys.ArrowRight) player.a += 2.2*dt;

    const ix = mv.x + kx, iy = mv.y + ky;
    const spd = (sprint ? 4.2 : 2.7) * dt;
    if (ix || iy) {
      const fwd = -iy, str = ix;
      const nx = player.x + (Math.cos(player.a)*fwd - Math.sin(player.a)*str) * spd;
      const ny = player.y + (Math.sin(player.a)*fwd + Math.cos(player.a)*str) * spd;
      if (!solid(nx, player.y)) player.x = nx;
      if (!solid(player.x, ny)) player.y = ny;
      bob += dt * (sprint ? 13 : 8);
    }

    if (firing) fire();
    fireCd -= dt; nadeCd -= dt; meleeCd -= dt;
    muzzle = Math.max(0, muzzle - dt*9);
    recoil += (0 - recoil) * Math.min(1, dt*14);

    if (NET) {
      // smooth remote actors toward their last server position
      for (const e of actors) {
        if (e.tx === undefined) continue;
        e.x += (e.tx - e.x) * Math.min(1, dt * 12);
        e.y += (e.ty - e.y) * Math.min(1, dt * 12);
      }
      if (myScore() >= TARGET || foeScore() >= TARGET) { /* server ends it */ }
    } else {
      actors.forEach(e => stepBot(e, dt));
      enemyTrades(dt);
      time -= dt;
      if (time <= 0) { time = 0; endMatch(); }
    }

    const mm = Math.floor(time/60), ss = Math.floor(time%60);
    clock.textContent = mm + ':' + String(ss).padStart(2,'0');
  }
  render();
  drawMini();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- PAUSE / END ---------- */
function togglePause() {
  if (ended) return;
  running = !running;
  pauseOv.classList.toggle('open', !running);
  if (!running && document.pointerLockElement) document.exitPointerLock();
}

function buildResult(won, forfeit, sA, sB) {
  const acc = player.shots ? Math.round(player.hits/player.shots*100) : 0;
  return {
    won, forfeit: !!forfeit,
    scoreA: sA, scoreB: sB, target: TARGET,
    kills: player.kills, deaths: player.deaths, headshots: player.hs,
    assists: TVG.rnd(1, 6), accuracy: acc,
    kd: player.deaths ? +(player.kills/player.deaths).toFixed(2) : player.kills,
    map: M.map, gameMode: M.gameMode, type: M.type,
    online: NET,
    coins: forfeit ? 0 : (won ? 250 : 90) + player.kills*10,
    xp: forfeit ? 0 : (won ? 180 : 70) + player.kills*6,
    duration: (NET ? M.net.duration : 300) - Math.floor(time)
  };
}

function saveAndGo(r) {
  TVG.state.lastResult = r;
  TVG.bumpMission('d1',1); TVG.bumpMission('w1',1);
  if (r.won) { TVG.bumpMission('d3',1); TVG.bumpMission('w3',1); }
  TVG.save();
  setTimeout(() => location.href = 'result.html', 350);
}

function finishFromServer(d) {
  if (ended) return;
  ended = true; running = false;
  if (document.pointerLockElement) document.exitPointerLock();
  player.kills = d.you.kills; player.deaths = d.you.deaths;
  saveAndGo(buildResult(d.won, false, myScore(), foeScore()));
}

function endMatch(forfeit) {
  if (ended) return;
  if (NET && !forfeit) return;              // the server decides online matches
  ended = true; running = false;
  if (document.pointerLockElement) document.exitPointerLock();
  if (NET) TVGNet.send('leave', {});
  saveAndGo(buildResult(!forfeit && myScore() >= foeScore(), forfeit, myScore(), foeScore()));
}

setTimeout(() => dhint.style.opacity = 0, 6000);
if (!matchMedia('(pointer:fine)').matches) dhint.style.display = 'none';
</script>
