<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskVault - Offers</title>
    
    <link rel="icon" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg" type="image/jpeg">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #e9ecef;
            color: #333;
            font-family: 'Poppins', sans-serif;
        }
        .app-container {
            max-width: 430px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: auto;
            background: #FDFBF7;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            background: white;
        }
        .back-btn {
            padding: 10px;
            border-radius: 10px;
            background: #FFF0E6;
            color: #a94b11;
            text-decoration: none;
        }
        .header-title { font-weight: 700; }
        .paused-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
        }
        .paused-icon {
            font-size: 32px;
            padding: 16px;
            border-radius: 20px;
            background: #FFF0E6;
            color: #a94b11;
        }
        h1 { font-size: 22px; margin: 24px 0 8px; }
        p { font-size: 14px; line-height: 1.7; color: #666; }
        .dashboard-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            border-radius: 12px;
            background: #a94b11;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        .history-link { margin-top: 20px; color: #a94b11; font-size: 14px; }
        a:focus-visible { outline: 3px solid #333; outline-offset: 4px; }
        @media (min-width: 768px) {
            .app-container { margin: 4vh auto; min-height: 92vh; border-radius: 24px; overflow: hidden; }
        }
    </style>
</head>
<body>
    <!-- Offers are paused for everyone. No provider embed or launch script is loaded. -->
    <div class="app-container">
        <header class="header">
            <a href="dashboard.html" class="back-btn" aria-label="Back to dashboard">
                <i class="ri-arrow-left-line" aria-hidden="true"></i>
            </a>
            <span class="header-title">Offers</span>
        </header>
        <main class="paused-state" aria-labelledby="paused-title">
            <div class="paused-icon"><i class="ri-pause-circle-line" aria-hidden="true"></i></div>
            <h1 id="paused-title">Offers temporarily unavailable</h1>
            <p>Offers are currently paused for all users. Please check back later.</p>
            <a href="dashboard.html" class="dashboard-link">Back to dashboard</a>
            <a href="offer-history.html" class="history-link">View offer history</a>
        </main>
    </div>
</body>
</html>
