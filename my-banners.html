<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Banner Ads — TaskVault</title>
  <link rel="icon" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg" type="image/jpeg">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{ --orange-main:#FF8C42; --orange-dark:#E67A35; --orange-light:#FFF0E6; --silk-bg:#FDFBF7; --white:#FFF; --text-dark:#333; --text-light:#888; --shadow-sm:0 2px 6px rgba(255,140,66,0.06); --shadow-md:0 4px 12px rgba(255,140,66,0.1); --shadow-lg:0 8px 24px rgba(255,140,66,0.15); --gradient-orange:linear-gradient(135deg,#FF8C42 0%,#FF6B35 100%); --success:#10B981; --danger:#EF4444; --warning:#F59E0B; }
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; -webkit-tap-highlight-color:transparent; }
    html,body{ height:100%; overflow:hidden; }
    body{ background:#e9ecef; display:flex; justify-content:center; align-items:center; }
    .app-container{ width:100%; height:100dvh; max-width:430px; background:var(--silk-bg); position:relative; overflow:hidden; display:flex; flex-direction:column; }
    @media(min-width:768px){ .app-container{ height:92dvh; max-height:860px; border-radius:24px; box-shadow:0 0 40px rgba(0,0,0,0.12); } }
    .scroll-content{ flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:80px; }
    .scroll-content::-webkit-scrollbar{ width:2px; } .scroll-content::-webkit-scrollbar-thumb{ background:var(--orange-light); border-radius:2px; }

    .header{ display:flex; justify-content:space-between; align-items:center; padding:14px 20px 10px; background:var(--white); flex-shrink:0; }
    .header-left{ display:flex; align-items:center; gap:10px; }
    .back-btn{ width:36px; height:36px; border-radius:10px; background:var(--orange-light); color:var(--orange-main); display:flex; justify-content:center; align-items:center; font-size:18px; cursor:pointer; border:none; text-decoration:none; }
    .header-title{ font-size:14px; font-weight:700; color:var(--text-dark); }
    .header-subtitle{ font-size:10px; color:var(--text-light); }
    .place-btn{ background:var(--gradient-orange); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:12px; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:6px; }

    .stats-section{ padding:10px 20px 12px; }
    .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .stat-card{ background:var(--white); border-radius:12px; padding:10px 8px; text-align:center; border:1px solid rgba(255,140,66,0.06); box-shadow:var(--shadow-sm); }
    .stat-value{ font-size:15px; font-weight:800; color:var(--orange-dark); }
    .stat-label{ font-size:8px; color:var(--text-light); margin-top:3px; text-transform:uppercase; letter-spacing:.03em; font-weight:600; }

    .tabs{ display:flex; gap:8px; padding:0 20px 10px; overflow-x:auto; }
    .tabs::-webkit-scrollbar{ display:none; }
    .tab{ padding:8px 14px; border-radius:20px; border:1px solid rgba(255,140,66,0.15); background:var(--white); color:var(--text-light); font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .tab.active{ background:var(--gradient-orange); color:#fff; border-color:var(--orange-main); }

    .controls{ padding:0 20px 10px; display:flex; gap:8px; }
    .search-wrap{ flex:1; position:relative; }
    .search-wrap i{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-light); font-size:13px; }
    .search-input{ width:100%; padding:10px 12px 10px 36px; border-radius:10px; background:var(--white); border:1px solid rgba(255,140,66,0.15); font-size:12px; outline:none; }
    .refresh-btn{ width:40px; height:40px; border-radius:10px; background:var(--white); border:1px solid rgba(255,140,66,0.15); color:var(--orange-main); display:flex; align-items:center; justify-content:center; cursor:pointer; }

    .list-section{ padding:0 20px 12px; }
    .section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .section-title{ font-size:13px; font-weight:700; color:var(--text-dark); display:flex; align-items:center; gap:6px; }
    .section-title i{ color:var(--orange-main); }
    .count{ font-size:11px; color:var(--text-light); }

    .ad-card{ background:var(--white); border-radius:16px; padding:12px; border:1px solid rgba(255,140,66,0.06); box-shadow:var(--shadow-sm); margin-bottom:10px; position:relative; overflow:hidden; }
    .ad-card::before{ content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--orange-main); opacity:0; transition:opacity .3s; }
    .ad-card:hover::before{ opacity:1; }
    .ad-card.pending::before{ background:var(--warning); } .ad-card.active::before{ background:var(--success); } .ad-card.rejected::before{ background:var(--danger); } .ad-card.expired::before{ background:#9ca3af; }

    .ad-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
    .ad-title{ font-size:12px; font-weight:700; color:var(--text-dark); flex:1; padding-right:8px; }
    .status{ font-size:9px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; }
    .status.pending{ background:#FEF3C7; color:#92400E; } .status.active{ background:#D1FAE5; color:#065F46; } .status.rejected{ background:#FEE2E2; color:#991B1B; } .status.expired{ background:#E5E7EB; color:#374151; }

    .ad-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .meta{ font-size:10px; color:var(--text-light); display:flex; align-items:center; gap:3px; }
    .meta i{ color:var(--orange-main); font-size:11px; }

    .thumb{ width:100%; max-height:140px; object-fit:cover; border-radius:8px; border:1px solid #eee; margin:6px 0; }

    .stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed #e5e7eb; }
    .sbox{ text-align:center; }
    .sval{ font-size:12px; font-weight:700; color:var(--text-dark); }
    .slab{ font-size:8px; color:var(--text-light); text-transform:uppercase; margin-top:2px; }

    .ad-actions{ display:flex; gap:6px; margin-top:10px; }
    .btn-sm{ flex:1; padding:8px; border:none; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; text-decoration:none; }
    .btn-view{ background:var(--orange-light); color:var(--orange-dark); }
    .btn-renew{ background:#D1FAE5; color:#065F46; }
    .btn-cancel{ background:#FEE2E2; color:#991B1B; }

    .empty{ text-align:center; padding:30px 16px; color:var(--text-light); }
    .empty i{ font-size:36px; color:var(--orange-light); display:block; margin-bottom:8px; }
    .empty h3{ font-size:13px; color:var(--text-dark); margin-bottom:4px; }
    .empty p{ font-size:11px; }

    .toast{ position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--white); color:var(--text-dark); padding:10px 18px; border-radius:12px; font-size:12px; font-weight:600; opacity:0; visibility:hidden; transition:all .4s cubic-bezier(.68,-0.55,.265,1.55); z-index:3000; box-shadow:0 8px 30px rgba(0,0,0,0.12); display:flex; align-items:center; gap:8px; }
    .toast.show{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); top:22px; }
    .toast.success{ border-left:3px solid #10B981; } .toast.error{ border-left:3px solid #EF4444; }

    .loading-overlay{ position:fixed; inset:0; background:var(--silk-bg); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:3000; gap:12px; }
    .spinner{ width:36px; height:36px; border:3px solid var(--orange-light); border-top:3px solid var(--orange-main); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    .bottom-nav{ position:absolute; bottom:0; left:0; right:0; background:var(--white); display:flex; justify-content:space-around; align-items:center; padding:8px 16px 16px; box-shadow:0 -4px 20px rgba(0,0,0,0.04); border-top-left-radius:24px; border-top-right-radius:24px; }
    .nav-item{ display:flex; flex-direction:column; align-items:center; color:var(--text-light); text-decoration:none; font-size:9px; gap:3px; padding:6px 14px; border-radius:14px; }
    .nav-item i{ font-size:20px; } .nav-item.active{ color:var(--orange-main); background:var(--orange-light); }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div style="font-size:11px; color:#888; letter-spacing:2px; font-weight:600;">Loading Ads</div></div>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <a href="dashboard.html" class="back-btn"><i class="ri-arrow-left-line"></i></a>
        <div><div class="header-title">My Banner Ads</div><div class="header-subtitle">Track your promotions</div></div>
      </div>
      <a href="place-banner.html" class="place-btn"><i class="ri-add-line"></i> New Ad</a>
    </header>
    <div class="scroll-content">
      <section class="stats-section">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value" id="stTotal">0</div><div class="stat-label">Total</div></div>
          <div class="stat-card"><div class="stat-value" id="stActive" style="color:var(--success)">0</div><div class="stat-label">Active</div></div>
          <div class="stat-card"><div class="stat-value" id="stPending" style="color:var(--warning)">0</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-value" id="stClicks">0</div><div class="stat-label">Clicks</div></div>
        </div>
      </section>
      <section style="padding:0 20px 8px;">
        <div class="tabs" id="tabs">
          <button class="tab active" data-filter="all" onclick="setFilter('all')">All</button>
          <button class="tab" data-filter="pending" onclick="setFilter('pending')">Pending</button>
          <button class="tab" data-filter="active" onclick="setFilter('active')">Active</button>
          <button class="tab" data-filter="rejected" onclick="setFilter('rejected')">Rejected</button>
          <button class="tab" data-filter="expired" onclick="setFilter('expired')">Expired</button>
        </div>
      </section>
      <section class="controls">
        <div class="search-wrap"><i class="ri-search-line"></i><input id="searchInput" class="search-input" placeholder="Search by title or page" type="text"/></div>
        <button class="refresh-btn" onclick="refresh()"><i class="ri-refresh-line"></i></button>
      </section>
      <section class="list-section">
        <div class="section-head"><h3 class="section-title"><i class="ri-advertisement-line"></i> Your Ads</h3><span class="count" id="count">0 ads</span></div>
        <div id="adList"></div>
      </section>
    </div>
    <nav class="bottom-nav">
      <a href="menu.html" class="nav-item"><i class="ri-apps-line"></i><span>Menu</span></a>
      <a href="deposit.html" class="nav-item"><i class="ri-wallet-3-line"></i><span>Deposit</span></a>
      <a href="withdraw.html" class="nav-item"><i class="ri-upload-2-line"></i><span>Withdraw</span></a>
      <a href="profile.html" class="nav-item active"><i class="ri-user-3-line"></i><span>Profile</span></a>
    </nav>
  </div>
  <div id="toast" class="toast">Message</div>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig={apiKey:"AIzaSyAv6QCpopa0Q77AVTyjU5cqJEIKIE9OVTs",authDomain:"taskvault-412a0.firebaseapp.com",databaseURL:"https://taskvault-412a0-default-rtdb.firebaseio.com",projectId:"taskvault-412a0",storageBucket:"taskvault-412a0.firebasestorage.app",messagingSenderId:"420716701831",appId:"1:420716701831:web:c987d91f7f4c8684eb7022"};
    firebase.initializeApp(firebaseConfig);
    const auth=firebase.auth(); const db=firebase.firestore();
    let currentUser=null; let allAds=[]; let filter='all';
    function fmt(n){ return '$'+Number(n||0).toFixed(3); }
    function niceDate(ts){ try{ if(!ts) return '-'; if(ts.toDate) ts=ts.toDate(); return new Date(ts).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return '-';}}
    function showToast(m,type='info'){ const t=document.getElementById('toast'); t.className='toast '+type; let icon='ri-information-line'; if(type==='success') icon='ri-checkbox-circle-line'; if(type==='error') icon='ri-close-circle-line'; t.innerHTML=`<i class="${icon}"></i> ${m}`; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
    function setFilter(f){ filter=f; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.filter===f)); render(); }
    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    auth.onAuthStateChanged(user=>{
      if(!user){ document.getElementById('loadingOverlay').style.display='none'; showToast('Please sign in','error'); setTimeout(()=>location.href='login.html',1200); return; }
      currentUser=user; loadAds();
    });
    function loadAds(){
      const q=db.collection('bannerAds').where('owner','==', currentUser.uid);
      q.onSnapshot(snap=>{
        allAds=[]; snap.forEach(doc=> allAds.push({id:doc.id, ...doc.data()}));
        allAds.sort((a,b)=>{ const at=a.createdAt?.toDate? a.createdAt.toDate().getTime():0; const bt=b.createdAt?.toDate? b.createdAt.toDate().getTime():0; return bt-at; });
        updateStats(); render(); document.getElementById('loadingOverlay').style.display='none';
      }, err=>{ console.error(err); showToast('Error loading ads','error'); document.getElementById('loadingOverlay').style.display='none'; });
    }
    function updateStats(){
      const total=allAds.length; const active=allAds.filter(a=> (a.status||'').toLowerCase()==='active').length; const pending=allAds.filter(a=> (a.status||'').toLowerCase()==='pending').length;
      const clicks=allAds.reduce((s,a)=> s + (Number(a.clicks)||0),0);
      document.getElementById('stTotal').textContent=total; document.getElementById('stActive').textContent=active; document.getElementById('stPending').textContent=pending; document.getElementById('stClicks').textContent=clicks;
    }
    function render(){
      const list=document.getElementById('adList'); const countEl=document.getElementById('count');
      const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
      let filtered=[...allAds];
      if(filter!=='all') filtered=filtered.filter(a=> (a.status||'pending').toLowerCase()===filter);
      if(q) filtered=filtered.filter(a=> ((a.title||'')+' '+(a.page||'')+' '+(a.size||'')).toLowerCase().includes(q));
      countEl.textContent=`${filtered.length} ad${filtered.length!==1?'s':''}`;
      if(!filtered.length){
        list.innerHTML=`<div class="empty"><i class="ri-advertisement-line"></i><h3>No ${filter!=='all'?filter:''} ads found</h3><p>${filter==='all' ? 'Place your first banner ad to get started!' : 'No ads with this status.'}</p><a href="place-banner.html" style="display:inline-flex; margin-top:12px; background:linear-gradient(135deg,#FF8C42,#FF6B35); color:#fff; padding:10px 18px; border-radius:10px; text-decoration:none; font-size:12px; font-weight:700;"><i class="ri-add-line"></i> Place New Ad</a></div>`; return;
      }
      list.innerHTML='';
      filtered.forEach(ad=>{
        const status=(ad.status||'pending').toLowerCase();
        const card=document.createElement('div'); card.className=`ad-card ${status}`;
        const expired = ad.endDate && ad.endDate.toDate && ad.endDate.toDate().getTime() < Date.now() && status==='active';
        const displayStatus = expired ? 'expired' : status;
        card.innerHTML=`
          <div class="ad-header"><div class="ad-title">${escapeHtml(ad.title||'Untitled')}</div><span class="status ${displayStatus}">${displayStatus}</span></div>
          <div class="ad-meta">
            <span class="meta"><i class="ri-layout-line"></i> ${escapeHtml(ad.page||'-')} • ${escapeHtml(ad.size||'-')}</span>
            <span class="meta"><i class="ri-time-line"></i> ${niceDate(ad.createdAt)}</span>
            <span class="meta"><i class="ri-money-dollar-circle-line"></i> ${fmt(ad.price||ad.totalCost)}</span>
          </div>
          ${ad.imageBase64 ? `<img class="thumb" src="${ad.imageBase64}" alt="Banner" />` : ''}
          ${ad.targetUrl ? `<div class="meta" style="margin-top:4px;"><i class="ri-link"></i> <a href="${escapeHtml(ad.targetUrl)}" target="_blank" style="color:#FF8C42; font-size:11px; word-break:break-all;">${escapeHtml(ad.targetUrl)}</a></div>` : ''}
          ${status==='active' && ad.endDate ? `<div class="meta" style="margin-top:4px;"><i class="ri-calendar-check-line"></i> Expires: ${niceDate(ad.endDate)}</div>` : ''}
          ${ad.rejectionReason ? `<div style="background:#FEE2E2; color:#991B1B; padding:8px; border-radius:8px; font-size:11px; margin-top:6px;"><strong>Rejected:</strong> ${escapeHtml(ad.rejectionReason)}</div>` : ''}
          <div class="stats-row">
            <div class="sbox"><div class="sval">${ad.durationDays||'-'}</div><div class="slab">Days</div></div>
            <div class="sbox"><div class="sval">${ad.impressions||0}</div><div class="slab">Impressions</div></div>
            <div class="sbox"><div class="sval">${ad.clicks||0}</div><div class="slab">Clicks</div></div>
          </div>
          <div class="ad-actions">
            ${ad.targetUrl ? `<a class="btn-sm btn-view" href="${ad.targetUrl}" target="_blank"><i class="ri-external-link-line"></i> Visit</a>` : ''}
            ${displayStatus==='expired' ? `<a class="btn-sm btn-renew" href="place-banner.html?slot=${encodeURIComponent(ad.slotId||'')}"><i class="ri-refresh-line"></i> Renew</a>` : ''}
            ${status==='active' ? `<span class="btn-sm" style="background:#D1FAE5; color:#065F46;"><i class="ri-checkbox-circle-line"></i> Live</span>` : ''}
          </div>
        `;
        list.appendChild(card);
      });
    }
    document.getElementById('searchInput').addEventListener('input', render);
    function refresh(){ if(currentUser) loadAds(); }
  </script>
</body>
</html>
