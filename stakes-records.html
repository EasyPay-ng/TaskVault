<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TaskVault – Stake Records</title>
  <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg"/>
  <link rel="shortcut icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --orange:#f97316; --orange-light:#fff7ed; --orange-dark:#ea580c; --orange-glow:rgba(249,115,22,0.15);
      --white:#fff; --gray:#6b7280; --gray-light:#9ca3af; --red:#dc2626; --green:#16a34a; --blue:#2563eb; --purple:#9333ea;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
      --shadow:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05);
      --shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1),0 10px 10px -5px rgba(0,0,0,0.04);
      --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-xl:24px;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,sans-serif;}
    body{background:var(--orange-light);color:#1f2937;min-height:100vh;-webkit-font-smoothing:antialiased;}
    header{background:var(--orange);color:var(--white);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-lg);position:sticky;top:0;z-index:100;}
    .logo-wrap{display:flex;align-items:center;gap:.75rem;}
    .logo-wrap img{width:36px;height:36px;border-radius:10px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
    .logo-wrap h1{font-size:1.15rem;font-weight:800;letter-spacing:-0.02em;}
    .header-btns{display:flex;gap:.5rem;align-items:center;}
    .header-btn{background:rgba(255,255,255,0.15);color:var(--white);border:none;padding:.5rem 1rem;border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .2s ease;display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;}
    .header-btn:hover{background:rgba(255,255,255,0.25);transform:translateY(-1px);}
    .balance-pill{background:rgba(255,255,255,0.2);padding:.4rem .9rem;border-radius:20px;font-size:.85rem;font-weight:700;border:1px solid rgba(255,255,255,0.1);}
    .container{max-width:1000px;margin:0 auto;padding:1.5rem;}

    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem;}
    .stat-card{background:var(--white);border-radius:var(--radius-lg);padding:1.3rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:1rem;transition:all .25s ease;border:1px solid transparent;}
    .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--orange-glow);}
    .stat-ic{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
    .stat-val{font-size:1.5rem;font-weight:800;line-height:1.1;color:#111827;letter-spacing:-0.02em;}
    .stat-lbl{font-size:.78rem;color:var(--gray);font-weight:600;margin-top:.15rem;}
    .stat-sub{font-size:.72rem;color:var(--gray-light);font-weight:600;margin-top:.1rem;}

    .panel{background:var(--white);border-radius:var(--radius-xl);padding:1.5rem;box-shadow:var(--shadow-lg);margin-bottom:1.5rem;border:1px solid #f3f4f6;}
    .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;gap:.75rem;flex-wrap:wrap;}
    .panel-head h2{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:.5rem;}
    .panel-head h2 i{color:var(--orange);}

    .toolbar{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap;}
    .filter-bar{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;scrollbar-width:none;}
    .filter-bar::-webkit-scrollbar{display:none;}
    .filter-btn{padding:.5rem 1.05rem;border:2px solid var(--orange);background:var(--white);color:var(--orange);border-radius:20px;cursor:pointer;font-size:.8rem;font-weight:700;white-space:nowrap;transition:all .25s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:.35rem;}
    .filter-btn.active,.filter-btn:hover{background:var(--orange);color:var(--white);transform:translateY(-1px);box-shadow:var(--shadow);}
    .filter-btn .c{background:rgba(249,115,22,0.15);color:var(--orange-dark);padding:0 .4rem;border-radius:10px;font-size:.7rem;font-weight:800;}
    .filter-btn.active .c{background:rgba(255,255,255,0.25);color:#fff;}
    .search-wrap{display:flex;align-items:center;gap:.6rem;background:var(--white);border:2px solid #e5e7eb;border-radius:var(--radius);padding:.55rem .9rem;flex:1;min-width:180px;}
    .search-wrap i{color:var(--gray-light);}
    .search-wrap input{flex:1;border:none;background:transparent;font-size:.88rem;outline:none;font-weight:500;}

    .stake-list{display:flex;flex-direction:column;gap:.75rem;}
    .stake-row{display:flex;align-items:center;gap:1rem;background:#f9fafb;border-radius:var(--radius);padding:.9rem 1rem;transition:all .2s ease;border:1px solid transparent;}
    .stake-row:hover{background:var(--orange-light);border-color:var(--orange-glow);}
    .stake-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
    .ic-sports{background:#fee2e2;color:var(--red);}
    .ic-crypto{background:#dbeafe;color:var(--blue);}
    .ic-reallife{background:#dcfce7;color:var(--green);}
    .ic-entertainment{background:#f3e8ff;color:var(--purple);}
    .ic-other{background:#f3f4f6;color:var(--gray);}
    .stake-main{flex:1;min-width:0;}
    .stake-q{font-weight:800;font-size:.92rem;color:#1f2937;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
    .stake-meta{font-size:.76rem;color:var(--gray);margin-top:.2rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
    .stake-meta .pick{font-weight:700;color:#374151;}
    .stake-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--gray-light);display:inline-block;}
    .stake-right{text-align:right;flex-shrink:0;}
    .stake-amt{font-weight:800;font-size:1.02rem;color:var(--orange-dark);}
    .status-pill{display:inline-block;margin-top:.3rem;padding:.15rem .5rem;border-radius:6px;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
    .st-active{background:#dbeafe;color:var(--blue);}
    .st-won{background:#dcfce7;color:var(--green);}
    .st-lost{background:#fee2e2;color:var(--red);}
    .st-refunded,.st-pending{background:#f3f4f6;color:var(--gray);}

    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .empty-state{text-align:center;padding:3rem 1rem;color:var(--gray);}
    .empty-state i{font-size:3rem;margin-bottom:1rem;color:#e5e7eb;}
    .empty-state p{font-weight:500;margin-bottom:.25rem;}
    .empty-state small{color:var(--gray-light);}
    .hidden{display:none !important;}
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
    @media (max-width:560px){.stake-row{flex-wrap:wrap;}.stake-right{width:100%;display:flex;justify-content:space-between;align-items:center;}.stake-amt{font-size:1rem;}}
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg" alt="TaskVault"/>
    <h1>Stake Records</h1>
  </div>
  <div class="header-btns">
    <span class="balance-pill" id="balanceDisplay">$0.00</span>
    <a class="header-btn" href="stake.html"><i class="fas fa-coins"></i> Stake</a>
    <a class="header-btn" href="marketplace.html"><i class="fas fa-chart-line"></i> Market</a>
  </div>
</header>

<div class="container">
  <div id="loadingState" class="stake-list">
    <div class="stake-row"><div class="skeleton stake-ic"></div><div style="flex:1;"><div class="skeleton" style="width:60%;height:18px;margin-bottom:.5rem;"></div><div class="skeleton" style="width:80%;height:12px;"></div></div><div class="skeleton" style="width:60px;height:24px;"></div></div>
    <div class="stake-row"><div class="skeleton stake-ic"></div><div style="flex:1;"><div class="skeleton" style="width:60%;height:18px;margin-bottom:.5rem;"></div><div class="skeleton" style="width:80%;height:12px;"></div></div><div class="skeleton" style="width:60px;height:24px;"></div></div>
  </div>

  <div id="app" class="hidden">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-ic" style="background:var(--orange-light);color:var(--orange);"><i class="fas fa-coins"></i></div>
        <div><div class="stat-val" id="totalStaked">$0.00</div><div class="stat-lbl">Total Staked</div><div class="stat-sub" id="stakeCount">0 stakes</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-ic" style="background:#dbeafe;color:var(--blue);"><i class="fas fa-hourglass-half"></i></div>
        <div><div class="stat-val" id="activeCount">0</div><div class="stat-lbl">Active</div><div class="stat-sub">awaiting result</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-ic" style="background:#dcfce7;color:var(--green);"><i class="fas fa-trophy"></i></div>
        <div><div class="stat-val" id="wonCount">0</div><div class="stat-lbl">Won</div><div class="stat-sub" id="wonSub">$0.00 winnings</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-ic" style="background:#fee2e2;color:var(--red);"><i class="fas fa-circle-xmark"></i></div>
        <div><div class="stat-val" id="lostCount">0</div><div class="stat-lbl">Lost</div><div class="stat-sub">settled</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2><i class="fas fa-list-ul"></i> Staking History</h2>
      </div>
      <div class="toolbar">
        <div class="filter-bar">
          <button class="filter-btn active" data-f="all">All <span class="c" id="cAll">0</span></button>
          <button class="filter-btn" data-f="active">Active <span class="c" id="cActive">0</span></button>
          <button class="filter-btn" data-f="won">Won <span class="c" id="cWon">0</span></button>
          <button class="filter-btn" data-f="lost">Lost <span class="c" id="cLost">0</span></button>
        </div>
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search your stakes..."/>
        </div>
      </div>
      <div class="stake-list" id="stakeList"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, query, orderBy,
    getDocs
  } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAv6QCpopa0Q77AVTyjU5cqJEIKIE9OVTs",
    authDomain: "taskvault-412a0.firebaseapp.com",
    projectId: "taskvault-412a0",
    storageBucket: "taskvault-412a0.firebasestorage.app",
    messagingSenderId: "420716701831",
    appId: "1:420716701831:web:c987d91f7f4c8684eb7022"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let stakes = [];
  let activeFilter = 'all';
  let searchQuery = '';

  const loadingState = document.getElementById('loadingState');
  const appEl = document.getElementById('app');

  onAuthStateChanged(auth, async (user) => {
    if (!user) { location.href = 'login.html'; return; }
    currentUser = user;
    await init();
  });

  async function init() {
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid));
      if (snap.exists()) document.getElementById('balanceDisplay').textContent = `$${((snap.data().balance)||0).toFixed(2)}`;
    } catch (e) {}
    await loadStakes();
    loadingState.classList.add('hidden');
    appEl.classList.remove('hidden');
    computeStats();
    renderList();
  }

  async function loadStakes() {
    try {
      let snap;
      try {
        const q = query(collection(db, 'users', currentUser.uid, 'stakes'), orderBy('createdAt', 'desc'));
        snap = await getDocs(q);
      } catch (e) {
        const q = collection(db, 'users', currentUser.uid, 'stakes');
        snap = await getDocs(q);
      }
      stakes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      stakes.sort((a,b) => (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0));
    } catch (err) { console.error('[Records] load', err); stakes = []; }
  }

  function normStatus(s) {
    s = (s || 'active').toString().toLowerCase();
    if (['active','open','pending'].includes(s)) return 'active';
    if (['won','win','winner','paid'].includes(s)) return 'won';
    if (['lost','lose','loss'].includes(s)) return 'lost';
    if (['refunded','void','cancelled','canceled'].includes(s)) return 'refunded';
    return 'active';
  }

  function computeStats() {
    const total = stakes.reduce((s,x)=>s+(x.amount||0),0);
    const byStatus = { active:0, won:0, lost:0, refunded:0 };
    let winnings = 0;
    stakes.forEach(x => {
      const st = normStatus(x.status);
      byStatus[st] = (byStatus[st]||0)+1;
      if (st === 'won') winnings += (x.payout != null ? x.payout : (x.winnings != null ? x.winnings : x.amount||0));
    });
    document.getElementById('totalStaked').textContent = `$${total.toFixed(2)}`;
    document.getElementById('stakeCount').textContent = `${stakes.length} stake${stakes.length===1?'':'s'}`;
    document.getElementById('activeCount').textContent = byStatus.active;
    document.getElementById('wonCount').textContent = byStatus.won;
    document.getElementById('wonSub').textContent = `$${winnings.toFixed(2)} winnings`;
    document.getElementById('lostCount').textContent = byStatus.lost;
    document.getElementById('cAll').textContent = stakes.length;
    document.getElementById('cActive').textContent = byStatus.active;
    document.getElementById('cWon').textContent = byStatus.won;
    document.getElementById('cLost').textContent = byStatus.lost;
  }

  function catInfo(cat) {
    cat = (cat||'other').toLowerCase();
    if (cat === 'sports') return { cls:'ic-sports', icon:'fa-futbol', label:'Sports' };
    if (cat === 'crypto') return { cls:'ic-crypto', icon:'fa-bitcoin-sign', label:'Crypto' };
    if (cat === 'reallife' || cat === 'real life') return { cls:'ic-reallife', icon:'fa-globe', label:'Real Life' };
    if (cat === 'entertainment') return { cls:'ic-entertainment', icon:'fa-film', label:'Entertainment' };
    return { cls:'ic-other', icon:'fa-tag', label: cat };
  }

  function renderList() {
    let list = stakes.slice();
    if (activeFilter !== 'all') list = list.filter(x => normStatus(x.status) === activeFilter);
    if (searchQuery) {
      list = list.filter(x =>
        (x.topicQuestion||'').toLowerCase().includes(searchQuery) ||
        (x.optionLabel||'').toLowerCase().includes(searchQuery) ||
        (x.topicId||'').toLowerCase().includes(searchQuery)
      );
    }
    const el = document.getElementById('stakeList');
    if (list.length === 0) {
      let msg = 'No stakes yet.';
      let sub = 'Head to the Stake page to place your first prediction.';
      if (activeFilter !== 'all') { msg = `No ${activeFilter} stakes.`; sub = 'Try a different filter.'; }
      if (searchQuery) { msg = 'No matching stakes.'; sub = 'Try another search.'; }
      el.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>${msg}</p><small>${sub}</small></div>`;
      return;
    }
    el.innerHTML = list.map(x => {
      const ci = catInfo(x.category);
      const st = normStatus(x.status);
      const stLabel = st === 'active' ? 'Active' : st === 'won' ? 'Won' : st === 'lost' ? 'Lost' : 'Refunded';
      const date = x.createdAt?.toDate ? x.createdAt.toDate().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : 'Recently';
      return `
        <div class="stake-row">
          <div class="stake-ic ${ci.cls}"><i class="fas ${ci.icon}"></i></div>
          <div class="stake-main">
            <div class="stake-q">${escapeHtml(x.topicQuestion || 'Stake')}</div>
            <div class="stake-meta">
              <span class="pick"><i class="fas fa-circle-dot" style="font-size:.5rem;color:var(--orange);"></i> ${escapeHtml(x.optionLabel || '—')}</span>
              <span class="dot"></span>
              <span>${ci.label}</span>
              <span class="dot"></span>
              <span>${date}</span>
            </div>
          </div>
          <div class="stake-right">
            <div class="stake-amt">$${(x.amount||0).toFixed(2)}</div>
            <span class="status-pill st-${st}">${stLabel}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.f;
      renderList();
    });
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    renderList();
  });

  function escapeHtml(t){ if(t==null)return''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
</script>

</body>
</html>
