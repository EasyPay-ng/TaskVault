<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Admin — Task Submissions | TaskVault</title>

  <link rel="icon"
        href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg"
        type="image/jpeg">

  <link rel="manifest" href="manifest.json">

  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>
    :root {
      --orange-main: #FF8C42;
      --orange-dark: #E67A35;
      --orange-light: #FFF0E6;

      --silk-bg: #FDFBF7;
      --white: #FFFFFF;

      --text-dark: #333333;
      --text-light: #888888;

      --shadow-sm: 0 2px 6px rgba(255,140,66,.06);
      --shadow-md: 0 4px 12px rgba(255,140,66,.10);
      --shadow-lg: 0 8px 24px rgba(255,140,66,.15);

      --gradient-orange:
        linear-gradient(135deg,#FF8C42 0%,#FF6B35 100%);

      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --info: #3B82F6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      height: 100dvh;
      max-width: 430px;
      background: var(--silk-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media(min-width:768px) {
      .app-container {
        height: 92dvh;
        max-height: 850px;
        border-radius: 24px;
        box-shadow: 0 0 40px rgba(0,0,0,.12);
      }
    }

    /* ================= HEADER ================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 12px;
      background: var(--white);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--orange-light);
      color: var(--orange-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .header-subtitle {
      font-size: 9px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .admin-badge {
      background: #FFF0E6;
      color: var(--orange-dark);
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ================= SCROLL ================= */

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    .scroll-content::-webkit-scrollbar {
      width: 2px;
    }

    .scroll-content::-webkit-scrollbar-thumb {
      background: var(--orange-light);
    }

    /* ================= STATS ================= */

    .stats-section {
      padding: 12px 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .stat-card {
      background: var(--white);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid rgba(255,140,66,.06);
      box-shadow: var(--shadow-sm);
    }

    .stat-card.full {
      grid-column: span 2;
    }

    .stat-value {
      font-size: 19px;
      font-weight: 800;
      line-height: 1;
      color: var(--orange-dark);
    }

    .stat-label {
      font-size: 8px;
      color: var(--text-light);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 600;
    }

    /* ================= CONTROLS ================= */

    .controls-section {
      padding: 0 20px 12px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 14px;
    }

    .search-input {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255,140,66,.15);
      background: white;
      outline: none;
      padding: 0 12px 0 36px;
      font-size: 12px;
      color: var(--text-dark);
    }

    .search-input:focus {
      border-color: var(--orange-main);
      box-shadow: 0 0 0 3px rgba(255,140,66,.08);
    }

    .refresh-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255,140,66,.15);
      background: white;
      color: var(--orange-main);
      cursor: pointer;
      font-size: 17px;
      flex-shrink: 0;
    }

    .refresh-btn.spinning i {
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= FILTERS ================= */

    .filter-row {
      display: flex;
      gap: 7px;
      margin-top: 9px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      border: none;
      background: white;
      color: var(--text-light);
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid rgba(255,140,66,.08);
    }

    .filter-btn.active {
      background: var(--orange-main);
      color: white;
      border-color: var(--orange-main);
    }

    /* ================= SECTION ================= */

    .list-section {
      padding: 0 20px 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title i {
      color: var(--orange-main);
    }

    .count-text {
      font-size: 10px;
      color: var(--text-light);
    }

    /* ================= TASK CARD ================= */

    .task-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,140,66,.06);
      box-shadow: var(--shadow-sm);
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .task-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.35;
      flex: 1;
    }

    .task-status {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 20px;
      height: fit-content;
      white-space: nowrap;
    }

    .task-status.pending {
      background: #FEF3C7;
      color: #92400E;
    }

    .task-status.approved {
      background: #D1FAE5;
      color: #065F46;
    }

    .task-status.rejected {
      background: #FEE2E2;
      color: #991B1B;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 9px;
    }

    .meta {
      font-size: 9px;
      color: var(--text-light);
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .meta i {
      color: var(--orange-main);
      font-size: 11px;
    }

    .task-owner {
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px dashed #e5e7eb;
      font-size: 9px;
      color: var(--text-light);
      word-break: break-word;
    }

    .task-owner strong {
      color: var(--text-dark);
    }

    .task-stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .mini-stat {
      background: #fafafa;
      border-radius: 9px;
      padding: 8px 4px;
      text-align: center;
    }

    .mini-value {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .mini-label {
      font-size: 7px;
      color: var(--text-light);
      margin-top: 2px;
      text-transform: uppercase;
    }

    .view-submissions-btn {
      width: 100%;
      border: none;
      margin-top: 11px;
      height: 38px;
      border-radius: 10px;
      background: var(--gradient-orange);
      color: white;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* ================= EMPTY ================= */

    .empty-state {
      background: white;
      border-radius: 16px;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .empty-state i {
      font-size: 45px;
      color: var(--orange-light);
      display: block;
      margin-bottom: 10px;
    }

    .empty-state h3 {
      font-size: 14px;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .empty-state p {
      font-size: 11px;
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(4px);
      z-index: 2500;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .overlay.show {
      display: flex;
    }

    .panel {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: var(--silk-bg);
      display: flex;
      flex-direction: column;
    }

    @media(min-width:768px) {
      .panel {
        height: 92dvh;
        max-height: 850px;
        border-radius: 24px;
        overflow: hidden;
      }
    }

    .panel-header {
      background: var(--gradient-orange);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-header h3 {
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px 20px 80px;
    }

    /* ================= SUMMARY ================= */

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .summary-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .summary-meta span {
      font-size: 9px;
      color: var(--text-light);
    }

    /* ================= SUBMISSION ================= */

    .submission-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,140,66,.06);
      box-shadow: var(--shadow-sm);
    }

    .submission-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .worker-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-dark);
      word-break: break-word;
    }

    .submission-status {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .submission-status.pending {
      background: #FEF3C7;
      color: #92400E;
    }

    .submission-status.approved {
      background: #D1FAE5;
      color: #065F46;
    }

    .submission-status.rejected {
      background: #FEE2E2;
      color: #991B1B;
    }

    .submission-date {
      font-size: 9px;
      color: var(--text-light);
      margin-top: 5px;
    }

    .proof {
      margin-top: 10px;
      background: #fafafa;
      border-radius: 9px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-dark);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .proof-img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 9px;
      cursor: pointer;
      border: 1px solid rgba(255,140,66,.1);
    }

    .submission-actions {
      display: flex;
      gap: 8px;
      margin-top: 11px;
    }

    .action-btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .approve-btn {
      background: #D1FAE5;
      color: #065F46;
    }

    .approve-btn:hover {
      background: #10B981;
      color: white;
    }

    .reject-btn {
      background: #FEE2E2;
      color: #991B1B;
    }

    .reject-btn:hover {
      background: #EF4444;
      color: white;
    }

    .credited {
      margin-top: 9px;
      padding: 8px;
      background: #ECFDF5;
      color: #047857;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      text-align: center;
    }

    .rejected-note {
      margin-top: 9px;
      padding: 8px;
      background: #FEF2F2;
      color: #B91C1C;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      text-align: center;
    }

    /* ================= LOADING ================= */

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--silk-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 4000;
      gap: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--orange-light);
      border-top-color: var(--orange-main);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loader-text {
      font-size: 10px;
      color: var(--text-light);
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translate(-50%,-100px);
      background: white;
      color: var(--text-dark);
      padding: 10px 16px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      visibility: hidden;
      transition: .35s;
      z-index: 5000;
      max-width: 90%;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%,0);
    }

    .toast.success {
      border-left: 3px solid var(--success);
    }

    .toast.error {
      border-left: 3px solid var(--danger);
    }

    .toast.info {
      border-left: 3px solid var(--orange-main);
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 16px 16px;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,.04);
      z-index: 1000;
    }

    .nav-item {
      text-decoration: none;
      color: var(--text-light);
      font-size: 8px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 14px;
      border-radius: 13px;
    }

    .nav-item i {
      font-size: 19px;
    }

    .nav-item.active {
      color: var(--orange-main);
      background: var(--orange-light);
    }

    /* ================= FADE ================= */

    .fade-in {
      animation: fadeIn .4s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loader-text">LOADING ADMIN</div>
</div>


<div class="app-container">

  <!-- HEADER -->
  <header class="header">

    <div class="header-left">

      <a href="dashboard.html" class="back-btn">
        <i class="ri-arrow-left-line"></i>
      </a>

      <div>
        <div class="header-title">
          Submission Manager
        </div>

        <div class="header-subtitle">
          Review submissions from all advertised tasks
        </div>
      </div>

    </div>

    <div class="admin-badge">
      ADMIN
    </div>

  </header>


  <!-- CONTENT -->
  <div class="scroll-content">

    <!-- STATS -->
    <section class="stats-section">

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-value" id="statTasks">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>

        <div class="stat-card">
          <div class="stat-value" id="statSubmissions">
            0
          </div>
          <div class="stat-label">Submissions</div>
        </div>

        <div class="stat-card">
          <div class="stat-value"
               id="statPending"
               style="color:var(--warning);">
            0
          </div>
          <div class="stat-label">Pending Review</div>
        </div>

        <div class="stat-card">
          <div class="stat-value"
               id="statApproved"
               style="color:var(--success);">
            0
          </div>
          <div class="stat-label">Approved</div>
        </div>

        <div class="stat-card full">
          <div class="stat-value"
               id="statPaid"
               style="color:var(--orange-dark);">
            $0.000
          </div>

          <div class="stat-label">
            Total Rewards Approved
          </div>
        </div>

      </div>

    </section>


    <!-- SEARCH / FILTER -->
    <section class="controls-section">

      <div class="search-row">

        <div class="search-wrap">

          <i class="ri-search-line"></i>

          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search task, worker, platform..."
          >

        </div>

        <button
          class="refresh-btn"
          id="refreshBtn"
          onclick="refreshData()"
        >
          <i class="ri-refresh-line"></i>
        </button>

      </div>


      <div class="filter-row">

        <button
          class="filter-btn active"
          data-filter="all"
          onclick="setFilter('all',this)"
        >
          All
        </button>

        <button
          class="filter-btn"
          data-filter="pending"
          onclick="setFilter('pending',this)"
        >
          Pending
        </button>

        <button
          class="filter-btn"
          data-filter="approved"
          onclick="setFilter('approved',this)"
        >
          Approved
        </button>

        <button
          class="filter-btn"
          data-filter="rejected"
          onclick="setFilter('rejected',this)"
        >
          Rejected
        </button>

      </div>

    </section>


    <!-- TASK LIST -->
    <section class="list-section">

      <div class="section-header">

        <div class="section-title">
          <i class="ri-file-list-3-line"></i>
          All Advertised Tasks
        </div>

        <div class="count-text" id="taskCount">
          0 tasks
        </div>

      </div>


      <div id="taskList">

        <div class="empty-state">

          <i class="ri-loader-4-line"></i>

          <h3>
            Loading tasks...
          </h3>

          <p>
            Please wait.
          </p>

        </div>

      </div>

    </section>

  </div>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="menu.html" class="nav-item">
      <i class="ri-apps-line"></i>
      <span>Menu</span>
    </a>

    <a href="deposit.html" class="nav-item">
      <i class="ri-wallet-3-line"></i>
      <span>Deposit</span>
    </a>

    <a href="withdraw.html" class="nav-item">
      <i class="ri-upload-2-line"></i>
      <span>Withdraw</span>
    </a>

    <a href="profile.html" class="nav-item">
      <i class="ri-user-3-line"></i>
      <span>Profile</span>
    </a>

  </nav>

</div>


<!-- SUBMISSIONS OVERLAY -->
<div
  class="overlay"
  id="overlay"
  role="dialog"
  aria-modal="true"
>

  <div class="panel">

    <div class="panel-header">

      <h3>
        <i class="ri-file-list-3-line"></i>
        Task Submissions
      </h3>

      <button
        class="close-btn"
        onclick="closeOverlay()"
      >
        <i class="ri-close-line"></i>
      </button>

    </div>


    <div
      class="panel-body"
      id="overlayContent"
    ></div>

  </div>

</div>


<!-- TOAST -->
<div id="toast" class="toast">
  Message
</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>


<script>

  /* =========================================================
     FIREBASE CONFIG
  ========================================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAv6QCpopa0Q77AVTyJ5cqJEIKIE9OVTs",

    authDomain:
      "taskvault-412a0.firebaseapp.com",

    databaseURL:
      "https://taskvault-412a0-default-rtdb.firebaseio.com",

    projectId:
      "taskvault-412a0",

    storageBucket:
      "taskvault-412a0.firebasestorage.app",

    messagingSenderId:
      "420716701831",

    appId:
      "1:420716701831:web:c987d91f7f4c8684eb7022",

    measurementId:
      "G-93JG3LB08B"

  };


  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();

  const db = firebase.firestore();


  /* =========================================================
     ADMIN ACCESS
  ========================================================= */

  const ADMIN_EMAILS = [

    "beniwealth70@gmail.com",

    "baasituoppor01@gmail.com"

  ];


  /* =========================================================
     GLOBAL VARIABLES
  ========================================================= */

  let currentUser = null;

  let allTasks = [];

  let allSubmissions = [];

  let taskMap = {};

  let activeFilter = "all";

  let unsubscribeTasks = null;


  /* =========================================================
     HELPERS
  ========================================================= */

  function fmtMoney(value) {

    return "$" + Number(value || 0).toFixed(3);

  }


  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function niceDate(timestamp) {

    try {

      if (!timestamp) return "-";

      if (timestamp.toDate) {
        timestamp = timestamp.toDate();
      }

      return new Date(timestamp).toLocaleString(
        "en-US",
        {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch {

      return "-";

    }

  }


  function showToast(message, type = "info") {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;

    toast.className =
      "toast " + type;

    toast.classList.add("show");

    setTimeout(() => {

      toast.classList.remove("show");

    }, 3000);

  }


  /* =========================================================
     AUTHENTICATION
  ========================================================= */

  auth.onAuthStateChanged(async user => {

    if (!user) {

      document.getElementById(
        "loadingOverlay"
      ).style.display = "none";

      showToast(
        "Please sign in first.",
        "error"
      );

      setTimeout(() => {

        window.location.href =
          "login.html";

      }, 1500);

      return;

    }


    const email =
      (user.email || "")
      .trim()
      .toLowerCase();


    if (!ADMIN_EMAILS.includes(email)) {

      document.getElementById(
        "loadingOverlay"
      ).style.display = "none";

      document.getElementById(
        "taskList"
      ).innerHTML = `

        <div class="empty-state">

          <i class="ri-shield-cross-line"
             style="color:#EF4444;"></i>

          <h3>
            Unauthorized Access
          </h3>

          <p>
            Your account does not have administrator permission.
          </p>

        </div>

      `;

      showToast(
        "Unauthorized admin access.",
        "error"
      );

      return;

    }


    currentUser = user;

    loadAdminData();

  });


  /* =========================================================
     LOAD ALL TASKS
  ========================================================= */

  function loadAdminData() {

    if (unsubscribeTasks) {

      unsubscribeTasks();

    }


    unsubscribeTasks = db
      .collection("advertise_tasks")
      .onSnapshot(

        async snapshot => {

          allTasks = [];

          taskMap = {};


          snapshot.forEach(doc => {

            const data = doc.data();

            const task = {

              id: doc.id,

              ...data,

              submissions: [],

              submissionCount: 0,

              pendingCount: 0,

              approvedCount: 0,

              rejectedCount: 0

            };


            allTasks.push(task);

            taskMap[doc.id] = task;

          });


          allTasks.sort((a,b) => {

            const at =
              a.createdAt?.toDate
                ? a.createdAt.toDate().getTime()
                : 0;

            const bt =
              b.createdAt?.toDate
                ? b.createdAt.toDate().getTime()
                : 0;

            return bt - at;

          });


          await loadAllSubmissions();


          renderTasks();

          updateStats();


          document.getElementById(
            "loadingOverlay"
          ).style.display = "none";

        },

        error => {

          console.error(error);

          document.getElementById(
            "loadingOverlay"
          ).style.display = "none";


          document.getElementById(
            "taskList"
          ).innerHTML = `

            <div class="empty-state">

              <i class="ri-error-warning-line"
                 style="color:#EF4444;"></i>

              <h3>
                Failed to load data
              </h3>

              <p>
                ${escapeHtml(error.message)}
              </p>

            </div>

          `;

          showToast(
            "Failed to load admin data.",
            "error"
          );

        }

      );

  }


  /* =========================================================
     LOAD ALL SUBMISSIONS
  ========================================================= */

  async function loadAllSubmissions() {

    allSubmissions = [];


    try {

      const snapshot = await db
        .collection("advert_submissions")
        .get();


      snapshot.forEach(doc => {

        const submission = {

          id: doc.id,

          ...doc.data()

        };


        allSubmissions.push(
          submission
        );


        const task =
          taskMap[submission.advertId];


        if (!task) return;


        task.submissions.push(
          submission
        );

        task.submissionCount++;


        const status =
          (submission.status || "pending")
          .toLowerCase();


        if (status === "pending") {

          task.pendingCount++;

        }

        if (status === "approved") {

          task.approvedCount++;

        }

        if (status === "rejected") {

          task.rejectedCount++;

        }

      });


      allTasks.forEach(task => {

        task.submissions.sort(
          (a,b) => {

            const at =
              a.createdAt?.toDate
                ? a.createdAt.toDate().getTime()
                : 0;

            const bt =
              b.createdAt?.toDate
                ? b.createdAt.toDate().getTime()
                : 0;

            return bt - at;

          }
        );

      });


    } catch (error) {

      console.error(
        "Submission loading error:",
        error
      );

      showToast(
        "Could not load submissions.",
        "error"
      );

    }

  }


  /* =========================================================
     STATISTICS
  ========================================================= */

  function updateStats() {

    const totalTasks =
      allTasks.length;


    const totalSubmissions =
      allSubmissions.length;


    const pending =
      allSubmissions.filter(
        s =>
          (s.status || "pending")
          .toLowerCase() === "pending"
      ).length;


    const approved =
      allSubmissions.filter(
        s =>
          (s.status || "")
          .toLowerCase() === "approved"
      ).length;


    let paid = 0;


    allSubmissions.forEach(s => {

      if (
        (s.status || "")
        .toLowerCase() === "approved"
      ) {

        const task =
          taskMap[s.advertId];

        if (task) {

          paid += Number(
            task.unitPrice || 0
          );

        }

      }

    });


    document.getElementById(
      "statTasks"
    ).textContent = totalTasks;


    document.getElementById(
      "statSubmissions"
    ).textContent = totalSubmissions;


    document.getElementById(
      "statPending"
    ).textContent = pending;


    document.getElementById(
      "statApproved"
    ).textContent = approved;


    document.getElementById(
      "statPaid"
    ).textContent = fmtMoney(paid);

  }


  /* =========================================================
     FILTER
  ========================================================= */

  function setFilter(filter, button) {

    activeFilter = filter;


    document.querySelectorAll(
      ".filter-btn"
    ).forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


    button.classList.add(
      "active"
    );


    renderTasks();

  }


  /* =========================================================
     SEARCH
  ========================================================= */

  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      renderTasks
    );


  /* =========================================================
     RENDER TASKS
  ========================================================= */

  function renderTasks() {

    const search =
      (
        document.getElementById(
          "searchInput"
        ).value || ""
      )
      .toLowerCase()
      .trim();


    const list =
      document.getElementById(
        "taskList"
      );


    let filtered =
      allTasks.filter(task => {


        let matchesSearch = true;


        if (search) {

          const taskText = (

            (task.title || "") +
            " " +
            (task.platform || "") +
            " " +
            (task.subcategory || "") +
            " " +
            (task.owner || "")

          ).toLowerCase();


          const workerText =
            task.submissions
              .map(s =>
                (
                  s.username ||
                  s.userName ||
                  s.userId ||
                  ""
                ).toLowerCase()
              )
              .join(" ");


          matchesSearch =
            taskText.includes(search) ||
            workerText.includes(search);

        }


        let matchesFilter = true;


        if (activeFilter !== "all") {

          matchesFilter =
            task.submissions.some(
              s =>
                (s.status || "pending")
                .toLowerCase() ===
                activeFilter
            );

        }


        return (
          matchesSearch &&
          matchesFilter
        );

      });


    document.getElementById(
      "taskCount"
    ).textContent =
      filtered.length +
      " task" +
      (filtered.length !== 1 ? "s" : "");


    if (!filtered.length) {

      list.innerHTML = `

        <div class="empty-state">

          <i class="ri-inbox-line"></i>

          <h3>
            No tasks found
          </h3>

          <p>
            No advertised tasks match your search or filter.
          </p>

        </div>

      `;

      return;

    }


    list.innerHTML = "";


    filtered.forEach(task => {

      const card =
        document.createElement("div");


      card.className =
        "task-card fade-in";


      const status =
        (task.status || "pending")
        .toLowerCase();


      card.innerHTML = `

        <div class="task-top">

          <div class="task-title">

            ${escapeHtml(
              task.title ||
              "Untitled Task"
            )}

          </div>

          <div class="task-status ${status}">

            ${escapeHtml(
              task.status ||
              "PENDING"
            )}

          </div>

        </div>


        <div class="task-meta">

          <div class="meta">
            <i class="ri-global-line"></i>
            ${escapeHtml(
              task.platform || "-"
            )}
          </div>

          <div class="meta">
            <i class="ri-price-tag-3-line"></i>
            ${escapeHtml(
              task.subcategory || "-"
            )}
          </div>

          <div class="meta">
            <i class="ri-calendar-line"></i>
            ${niceDate(
              task.createdAt
            )}
          </div>

        </div>


        <div class="task-owner">

          <i class="ri-user-line"></i>

          Advertiser:

          <strong>
            ${escapeHtml(
              task.owner || "Unknown"
            )}
          </strong>

        </div>


        <div class="task-stats">

          <div class="mini-stat">

            <div class="mini-value">
              ${task.submissionCount}
            </div>

            <div class="mini-label">
              Submissions
            </div>

          </div>


          <div class="mini-stat">

            <div
              class="mini-value"
              style="color:var(--warning);"
            >
              ${task.pendingCount}
            </div>

            <div class="mini-label">
              Pending
            </div>

          </div>


          <div class="mini-stat">

            <div
              class="mini-value"
              style="color:var(--success);"
            >
              ${task.approvedCount}
            </div>

            <div class="mini-label">
              Approved
            </div>

          </div>

        </div>


        <button
          class="view-submissions-btn"
          onclick="openSubmissions('${task.id}')"
        >

          <i class="ri-file-list-3-line"></i>

          View Submissions
          (${task.submissionCount})

        </button>

      `;


      list.appendChild(card);

    });

  }


  /* =========================================================
     OPEN SUBMISSIONS
  ========================================================= */

  function openSubmissions(taskId) {

    const task =
      taskMap[taskId];


    if (!task) {

      showToast(
        "Task not found.",
        "error"
      );

      return;

    }


    const content =
      document.getElementById(
        "overlayContent"
      );


    let submissions =
      [...task.submissions];


    if (activeFilter !== "all") {

      submissions =
        submissions.filter(
          s =>
            (s.status || "pending")
            .toLowerCase() ===
            activeFilter
        );

    }


    const summary = `

      <div class="summary-card">

        <div class="summary-title">

          ${escapeHtml(
            task.title ||
            "Untitled Task"
          )}

        </div>


        <div class="summary-meta">

          <span>
            <i class="ri-global-line"></i>
            ${escapeHtml(
              task.platform || "-"
            )}
          </span>

          <span>
            <i class="ri-coins-line"></i>
            ${fmtMoney(
              task.unitPrice
            )} / worker
          </span>

          <span>
            <i class="ri-user-line"></i>
            ${task.submissionCount}
            submissions
          </span>

          <span>
            <i class="ri-time-line"></i>
            ${niceDate(
              task.createdAt
            )}
          </span>

        </div>

      </div>

    `;


    if (!submissions.length) {

      content.innerHTML =
        summary +
        `

        <div class="empty-state">

          <i class="ri-inbox-line"></i>

          <h3>
            No submissions
          </h3>

          <p>
            There are no submissions matching the current filter.
          </p>

        </div>

        `;

    } else {

      content.innerHTML =
        summary +
        submissions
          .map(sub =>
            renderSubmission(
              task,
              sub
            )
          )
          .join("");

    }


    document
      .getElementById("overlay")
      .classList.add("show");


    document.body.style.overflow =
      "hidden";

  }


  /* =========================================================
     RENDER SUBMISSION
  ========================================================= */

  function renderSubmission(
    task,
    sub
  ) {

    const status =
      (sub.status || "pending")
      .toLowerCase();


    const worker =
      sub.username ||
      sub.userName ||
      sub.userId ||
      "Unknown Worker";


    let html = `

      <div
        class="submission-card"
        id="submission-${sub.id}"
      >

        <div class="submission-top">

          <div class="worker-name">

            <i class="ri-user-3-line"></i>

            ${escapeHtml(worker)}

          </div>

          <div class="submission-status ${status}">

            ${escapeHtml(
              sub.status ||
              "PENDING"
            )}

          </div>

        </div>


        <div class="submission-date">

          Submitted:
          ${niceDate(
            sub.createdAt
          )}

        </div>

    `;


    if (sub.textProof) {

      html += `

        <div class="proof">

          ${escapeHtml(
            sub.textProof
          )}

        </div>

      `;

    }


    if (sub.imageUrl) {

      html += `

        <img
          class="proof-img"
          src="${escapeHtml(
            sub.imageUrl
          )}"
          alt="Submission proof"
          onclick="window.open(
            '${escapeHtml(
              sub.imageUrl
            )}',
            '_blank'
          )"
        >

      `;

    }


    if (status === "pending") {

      html += `

        <div class="submission-actions">

          <button
            class="action-btn approve-btn"
            onclick="reviewSubmission(
              '${task.id}',
              '${sub.id}',
              '${escapeJs(sub.userId || "")}',
              'approved'
            )"
          >

            <i class="ri-check-line"></i>

            Approve & Pay
            ${fmtMoney(
              task.unitPrice
            )}

          </button>


          <button
            class="action-btn reject-btn"
            onclick="reviewSubmission(
              '${task.id}',
              '${sub.id}',
              '${escapeJs(sub.userId || "")}',
              'rejected'
            )"
          >

            <i class="ri-close-line"></i>

            Reject

          </button>

        </div>

      `;

    }


    if (status === "approved") {

      html += `

        <div class="credited">

          <i class="ri-checkbox-circle-line"></i>

          Approved and
          ${fmtMoney(
            task.unitPrice
          )}
          credited to worker

        </div>

      `;

    }


    if (status === "rejected") {

      html += `

        <div class="rejected-note">

          <i class="ri-close-circle-line"></i>

          Submission rejected

        </div>

      `;

    }


    html += `</div>`;


    return html;

  }


  function escapeJs(value) {

    return String(value || "")
      .replace(/\\/g,"\\\\")
      .replace(/'/g,"\\'")
      .replace(/"/g,'\\"')
      .replace(/\n/g,"\\n")
      .replace(/\r/g,"\\r");

  }


  /* =========================================================
     APPROVE / REJECT
  ========================================================= */

  async function reviewSubmission(
    taskId,
    submissionId,
    userId,
    newStatus
  ) {

    if (!currentUser) {

      showToast(
        "Admin session expired.",
        "error"
      );

      return;

    }


    const task =
      taskMap[taskId];


    if (!task) {

      showToast(
        "Task not found.",
        "error"
      );

      return;

    }


    const reward =
      Number(
        task.unitPrice || 0
      );


    if (
      newStatus === "approved" &&
      reward <= 0
    ) {

      showToast(
        "This task has an invalid reward amount.",
        "error"
      );

      return;

    }


    if (newStatus === "rejected") {

      const confirmed =
        confirm(
          "Reject this submission?"
        );

      if (!confirmed) return;

    }


    if (newStatus === "approved") {

      const confirmed =
        confirm(
          "Approve this submission and credit " +
          fmtMoney(reward) +
          " to the worker?"
        );

      if (!confirmed) return;

    }


    try {

      const subRef =
        db
          .collection(
            "advert_submissions"
          )
          .doc(submissionId);


      const subDoc =
        await subRef.get();


      if (!subDoc.exists) {

        showToast(
          "Submission no longer exists.",
          "error"
        );

        return;

      }


      const subData =
        subDoc.data();


      const currentStatus =
        (
          subData.status ||
          "pending"
        ).toLowerCase();


      /* Prevent duplicate processing */

      if (
        currentStatus === "approved" ||
        currentStatus === "rejected"
      ) {

        showToast(
          "This submission has already been reviewed.",
          "info"
        );

        await loadAllSubmissions();

        renderTasks();

        updateStats();

        openSubmissions(taskId);

        return;

      }


      const now =
        firebase.firestore
          .FieldValue
          .serverTimestamp();


      const batch =
        db.batch();


      /* ============================================
         1. UPDATE SUBMISSION
      ============================================ */

      batch.update(
        subRef,
        {

          status:
            newStatus,

          reviewedAt:
            now,

          reviewedBy:
            currentUser.uid,

          reviewedByEmail:
            currentUser.email

        }
      );


      /* ============================================
         2. APPROVAL PAYMENT
      ============================================ */

      if (
        newStatus === "approved"
      ) {

        if (!userId) {

          throw new Error(
            "Worker ID is missing. Cannot credit this submission."
          );

        }


        const userRef =
          db
            .collection("users")
            .doc(userId);


        const userDoc =
          await userRef.get();


        if (!userDoc.exists) {

          batch.set(
            userRef,
            {

              balance:
                reward,

              totalEarned:
                reward,

              updatedAt:
                now,

              createdAt:
                now

            },
            { merge: true }
          );

        } else {

          batch.update(
            userRef,
            {

              balance:
                firebase.firestore
                  .FieldValue
                  .increment(
                    reward
                  ),

              totalEarned:
                firebase.firestore
                  .FieldValue
                  .increment(
                    reward
                  ),

              updatedAt:
                now

            }
          );

        }


        /* ========================================
           3. UPDATE TASK APPROVED COUNT
        ======================================== */

        const taskRef =
          db
            .collection(
              "advertise_tasks"
            )
            .doc(taskId);


        batch.update(
          taskRef,
          {

            approvedCount:
              firebase.firestore
                .FieldValue
                .increment(1),

            updatedAt:
              now

          }
        );


        /* ========================================
           4. CREATE EARNINGS RECORD
        ======================================== */

        const earningRef =
          db
            .collection(
              "earnings"
            )
            .doc();


        batch.set(
          earningRef,
          {

            userId:
              userId,

            advertId:
              taskId,

            submissionId:
              submissionId,

            amount:
              reward,

            type:
              "task_reward",

            status:
              "completed",

            reviewedBy:
              currentUser.uid,

            reviewedByEmail:
              currentUser.email,

            createdAt:
              now

          }
        );

      }


      /* ============================================
         COMMIT
      ============================================ */

      await batch.commit();


      showToast(
        newStatus === "approved"
          ? "Submission approved and worker credited."
          : "Submission rejected.",
        "success"
      );


      /* ============================================
         RELOAD EVERYTHING
      ============================================ */

      await loadAllSubmissions();

      renderTasks();

      updateStats();

      openSubmissions(taskId);


    } catch (error) {

      console.error(
        "Review error:",
        error
      );


      showToast(
        error.message ||
        "Failed to process submission.",
        "error"
      );

    }

  }


  /* =========================================================
     CLOSE OVERLAY
  ========================================================= */

  function closeOverlay() {

    document
      .getElementById("overlay")
      .classList.remove("show");


    document.body.style.overflow =
      "";

  }


  document
    .getElementById("overlay")
    .addEventListener(
      "click",
      event => {

        if (
          event.target ===
          document.getElementById(
            "overlay"
          )
        ) {

          closeOverlay();

        }

      }
    );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape" &&
        document
          .getElementById(
            "overlay"
          )
          .classList.contains(
            "show"
          )
      ) {

        closeOverlay();

      }

    }
  );


  /* =========================================================
     REFRESH
  ========================================================= */

  async function refreshData() {

    const button =
      document.getElementById(
        "refreshBtn"
      );


    button.classList.add(
      "spinning"
    );


    try {

      await loadAllSubmissions();

      renderTasks();

      updateStats();

      showToast(
        "Data refreshed.",
        "success"
      );

    } catch(error) {

      console.error(error);

    }


    setTimeout(() => {

      button.classList.remove(
        "spinning"
      );

    }, 800);

  }

</script>
