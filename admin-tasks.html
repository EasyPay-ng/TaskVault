<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Admin — Advertised Tasks | TaskVault</title>

  <link rel="icon"
        href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg"
        type="image/jpeg">

  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>
    :root {
      --orange-main: #FF8C42;
      --orange-dark: #E67A35;
      --orange-light: #FFF0E6;

      --bg: #FDFBF7;
      --white: #FFFFFF;

      --text-dark: #292929;
      --text-light: #888;

      --success: #10B981;
      --success-light: #D1FAE5;

      --danger: #EF4444;
      --danger-light: #FEE2E2;

      --warning: #F59E0B;
      --warning-light: #FEF3C7;

      --blue: #3B82F6;
      --blue-light: #DBEAFE;

      --border: rgba(255,140,66,.10);

      --shadow-sm:
        0 2px 8px rgba(0,0,0,.05);

      --shadow-md:
        0 5px 18px rgba(0,0,0,.08);

      --gradient:
        linear-gradient(
          135deg,
          #FF8C42 0%,
          #FF6B35 100%
        );
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Poppins, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100dvh;
      max-width: 430px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width:768px) {
      .app {
        height: 92dvh;
        max-height: 850px;
        border-radius: 24px;
        box-shadow: 0 0 40px rgba(0,0,0,.12);
      }
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid #eee;
      z-index: 10;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 11px;
      background: var(--orange-light);
      color: var(--orange-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 19px;
      cursor: pointer;
    }

    .back-btn:hover {
      background: var(--orange-main);
      color: white;
    }

    .header-info {
      flex: 1;
    }

    .header-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .header-subtitle {
      font-size: 10px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .admin-badge {
      background: var(--orange-light);
      color: var(--orange-dark);
      padding: 5px 8px;
      border-radius: 20px;
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 90px;
    }

    .content::-webkit-scrollbar {
      width: 3px;
    }

    .content::-webkit-scrollbar-thumb {
      background: #ffd9c3;
      border-radius: 5px;
    }

    /* =========================
       ADMIN INFO
    ========================= */

    .admin-info {
      background: white;
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .admin-info-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .admin-info-title i {
      color: var(--success);
      font-size: 15px;
    }

    .admin-email {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-light);
      word-break: break-all;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      background: white;
      border-radius: 13px;
      padding: 12px 5px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .stat-number {
      font-size: 17px;
      font-weight: 800;
      color: var(--orange-dark);
      line-height: 1;
    }

    .stat-label {
      margin-top: 5px;
      font-size: 8px;
      color: var(--text-light);
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat.pending .stat-number {
      color: var(--warning);
    }

    .stat.approved .stat-number {
      color: var(--success);
    }

    .stat.rejected .stat-number {
      color: var(--danger);
    }

    /* =========================
       SEARCH
    ========================= */

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 13px;
    }

    .search {
      position: relative;
      flex: 1;
    }

    .search i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 15px;
    }

    .search input {
      width: 100%;
      height: 42px;
      border: 1px solid #eee;
      background: white;
      border-radius: 11px;
      outline: none;
      padding: 0 12px 0 36px;
      font-size: 11px;
      color: var(--text-dark);
    }

    .search input:focus {
      border-color: var(--orange-main);
      box-shadow: 0 0 0 3px rgba(255,140,66,.10);
    }

    .refresh-btn {
      width: 42px;
      height: 42px;
      border: 1px solid #eee;
      background: white;
      border-radius: 11px;
      color: var(--orange-main);
      font-size: 17px;
      cursor: pointer;
    }

    .refresh-btn.loading i {
      animation: rotate .8s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       TASK CARD
    ========================= */

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: .2s;
      position: relative;
      overflow: hidden;
    }

    .task-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .task-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--orange-main);
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .task-title {
      flex: 1;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.35;
    }

    .status {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .status.pending {
      color: #92400E;
      background: var(--warning-light);
    }

    .status.approved {
      color: #065F46;
      background: var(--success-light);
    }

    .status.rejected {
      color: #991B1B;
      background: var(--danger-light);
    }

    .task-owner {
      margin-top: 8px;
      font-size: 9px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 5px;
      word-break: break-all;
    }

    .task-owner i {
      color: var(--orange-main);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin-top: 9px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-light);
      font-size: 9px;
    }

    .meta i {
      color: var(--orange-main);
      font-size: 12px;
    }

    .task-values {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 6px;
      border-top: 1px dashed #eee;
      margin-top: 10px;
      padding-top: 10px;
    }

    .value {
      text-align: center;
    }

    .value strong {
      display: block;
      font-size: 12px;
      color: var(--text-dark);
    }

    .value span {
      display: block;
      margin-top: 2px;
      font-size: 8px;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .submission-count {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      background: var(--orange-light);
      color: var(--orange-dark);
      border-radius: 20px;
      font-size: 9px;
      font-weight: 700;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .empty i {
      font-size: 45px;
      color: #ffd7c0;
    }

    .empty h3 {
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-dark);
    }

    .empty p {
      margin-top: 5px;
      font-size: 10px;
      color: var(--text-light);
      line-height: 1.5;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid #fee2e2;
    }

    .error-box i {
      font-size: 42px;
      color: var(--danger);
    }

    .error-box h3 {
      margin-top: 8px;
      font-size: 14px;
    }

    .error-box p {
      margin-top: 5px;
      font-size: 10px;
      color: var(--text-light);
      line-height: 1.5;
      word-break: break-word;
    }

    .retry {
      margin-top: 14px;
      border: 0;
      background: var(--gradient);
      color: white;
      padding: 10px 17px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================
       OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.60);
      backdrop-filter: blur(5px);
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media(min-width:768px) {
      .modal {
        height: 92dvh;
        max-height: 850px;
        border-radius: 24px;
      }
    }

    .modal-header {
      background: var(--gradient);
      color: white;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 800;
    }

    .modal-title small {
      display: block;
      margin-top: 2px;
      font-size: 8px;
      font-weight: 400;
      opacity: .9;
    }

    .close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px 18px 40px;
    }

    /* =========================
       SUBMISSION
    ========================= */

    .submission {
      background: white;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .submission-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .worker {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      word-break: break-word;
    }

    .worker-id {
      font-size: 8px;
      color: #aaa;
      margin-top: 2px;
      word-break: break-all;
    }

    .submission-date {
      margin-top: 7px;
      font-size: 8px;
      color: #999;
    }

    .proof {
      margin-top: 9px;
      padding: 10px;
      border-radius: 9px;
      background: #fafafa;
      font-size: 10px;
      color: var(--text-dark);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .proof-img {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 9px;
      cursor: pointer;
      border: 1px solid #eee;
    }

    .actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .action {
      flex: 1;
      height: 36px;
      border: 0;
      border-radius: 9px;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .approve {
      background: var(--success-light);
      color: #065F46;
    }

    .approve:hover {
      background: var(--success);
      color: white;
    }

    .reject {
      background: var(--danger-light);
      color: #991B1B;
    }

    .reject:hover {
      background: var(--danger);
      color: white;
    }

    .action:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .already {
      margin-top: 9px;
      padding: 8px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      text-align: center;
    }

    .already.approved {
      background: var(--success-light);
      color: #065F46;
    }

    .already.rejected {
      background: var(--danger-light);
      color: #991B1B;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #ffe3d1;
      border-top-color: var(--orange-main);
      border-radius: 50%;
      animation: rotate .8s linear infinite;
    }

    .loading-text {
      margin-top: 12px;
      font-size: 10px;
      color: var(--text-light);
      font-weight: 600;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      z-index: 10000;
      left: 50%;
      top: 20px;
      transform: translate(-50%,-100px);
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
      font-size: 10px;
      font-weight: 700;
      opacity: 0;
      transition: .3s;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }

    .toast.success {
      border-left: 3px solid var(--success);
    }

    .toast.error {
      border-left: 3px solid var(--danger);
    }

    .toast.info {
      border-left: 3px solid var(--orange-main);
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #eee;
      z-index: 100;
    }

    .nav-item {
      text-decoration: none;
      color: #999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 8px;
    }

    .nav-item i {
      font-size: 19px;
    }

    .nav-item.active {
      color: var(--orange-main);
    }
  </style>
</head>

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value) {

  const n = Number(value || 0);

  return "$" + n.toFixed(3);

}


function dateFormat(value) {

  try {

    if (!value) return "-";

    if (
      value &&
      typeof value.toDate === "function"
    ) {

      value = value.toDate();

    }

    const d = new Date(value);

    if (isNaN(d.getTime())) {
      return "-";
    }

    return d.toLocaleString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  } catch {

    return "-";

  }

}


function showToast(message,type="info") {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.className =
    "toast " + type;

  setTimeout(() => {

    toast.classList.add("show");

  },10);

  setTimeout(() => {

    toast.classList.remove("show");

  },3500);

}


function hideLoading() {

  document.getElementById(
    "loadingScreen"
  ).style.display = "none";

}


function showLoading(text) {

  document.getElementById(
    "loadingText"
  ).textContent = text || "Loading...";

  document.getElementById(
    "loadingScreen"
  ).style.display = "flex";

}

/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadEverything() {

  if (!currentUser) {

    console.warn(
      "loadEverything called before authentication."
    );

    return;

  }


  const refresh =
    document.getElementById(
      "refreshBtn"
    );

  refresh.classList.add("loading");


  document.getElementById(
    "taskList"
  ).innerHTML = `

    <div class="empty">

      <i class="ri-loader-4-line"></i>

      <h3>
        Loading all advertised tasks...
      </h3>

      <p>
        Fetching tasks and submissions.
      </p>

    </div>

  `;


  try {

    /*
      IMPORTANT:

      NO OWNER FILTER HERE.

      This is what makes the page
      load tasks belonging to ALL users.
    */

    console.log(
      "Fetching advertise_tasks..."
    );


    const taskSnapshot =
      await db
        .collection("advertise_tasks")
        .get();


    console.log(
      "Tasks found:",
      taskSnapshot.size
    );


    allTasks = [];


    /*
      Fetch tasks
    */

    taskSnapshot.forEach(doc => {

      const data = doc.data() || {};

      allTasks.push({

        id: doc.id,

        ...data,

        submissions: []

      });

    });


    /*
      Sort newest first
    */

    allTasks.sort((a,b) => {

      const aTime =
        a.createdAt &&
        typeof a.createdAt.toDate === "function"
          ? a.createdAt.toDate().getTime()
          : 0;

      const bTime =
        b.createdAt &&
        typeof b.createdAt.toDate === "function"
          ? b.createdAt.toDate().getTime()
          : 0;

      return bTime - aTime;

    });


    /*
      Fetch submissions for each task
    */

    for (
      const task of allTasks
    ) {

      try {

        const submissionSnapshot =
          await db
            .collection("advert_submissions")
            .where(
              "advertId",
              "==",
              task.id
            )
            .get();


        task.submissions = [];


        submissionSnapshot.forEach(
          doc => {

            task.submissions.push({

              id: doc.id,

              ...doc.data()

            });

          }
        );


      } catch(error) {

        console.error(
          "Submission loading error:",
          task.id,
          error
        );

        task.submissions = [];

      }

    }


    renderTasks();

    updateStats();

    hideLoading();


    if (
      allTasks.length === 0
    ) {

      showToast(
        "No advertised tasks were found.",
        "info"
      );

    } else {

      showToast(
        `${allTasks.length} advertised task${allTasks.length !== 1 ? "s" : ""} loaded.`,
        "success"
      );

    }


  } catch(error) {

    console.error(
      "LOAD EVERYTHING ERROR:",
      error
    );


    hideLoading();


    document.getElementById(
      "taskList"
    ).innerHTML = `

      <div class="error-box">

        <i class="ri-error-warning-line"></i>

        <h3>
          Failed to load advertised tasks
        </h3>

        <p>
          ${escapeHtml(
            error.message ||
            "Unknown Firestore error"
          )}
        </p>

        <button
          class="retry"
          onclick="loadEverything()"
        >
          <i class="ri-refresh-line"></i>
          Try Again
        </button>

      </div>

    `;


    showToast(
      error.message ||
      "Could not load tasks.",
      "error"
    );

  } finally {

    refresh.classList.remove(
      "loading"
    );

  }

}


/* =========================================================
   RENDER TASKS
========================================================= */

function renderTasks() {

  const list =
    document.getElementById(
      "taskList"
    );


  const search =
    (
      document.getElementById(
        "searchInput"
      ).value || ""
    )
      .trim()
      .toLowerCase();


  let filtered =
    allTasks;


  if (search) {

    filtered =
      allTasks.filter(task => {

        const title =
          String(
            task.title || ""
          ).toLowerCase();

        const owner =
          String(
            task.owner ||
            task.ownerEmail ||
            ""
          ).toLowerCase();

        const platform =
          String(
            task.platform || ""
          ).toLowerCase();

        const status =
          String(
            task.status || ""
          ).toLowerCase();

        return (
          title.includes(search) ||
          owner.includes(search) ||
          platform.includes(search) ||
          status.includes(search)
        );

      });

  }


  if (
    filtered.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <i class="ri-folder-open-line"></i>

        <h3>
          ${
            search
              ? "No matching tasks"
              : "No advertised tasks"
          }
        </h3>

        <p>
          ${
            search
              ? "Try another search term."
              : "There are currently no advertised tasks."
          }
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(task => {

    const status =
      String(
        task.status || "pending"
      ).toLowerCase();


    const submissions =
      task.submissions || [];


    const pending =
      submissions.filter(
        s =>
          String(
            s.status || "pending"
          ).toLowerCase() === "pending"
      ).length;


    const approved =
      submissions.filter(
        s =>
          String(
            s.status || ""
          ).toLowerCase() === "approved"
      ).length;


    const rejected =
      submissions.filter(
        s =>
          String(
            s.status || ""
          ).toLowerCase() === "rejected"
      ).length;


    const owner =
      task.ownerEmail ||
      task.email ||
      task.owner ||
      "Unknown owner";


    const card =
      document.createElement("div");


    card.className =
      "task-card";


    card.onclick = () => {

      openTask(task.id);

    };


    card.innerHTML = `

      <div class="task-top">

        <div class="task-title">

          ${escapeHtml(
            task.title ||
            "Untitled Task"
          )}

        </div>

        <div class="status ${escapeHtml(status)}">

          ${escapeHtml(
            task.status ||
            "PENDING"
          )}

        </div>

      </div>


      <div class="task-owner">

        <i class="ri-user-line"></i>

        ${escapeHtml(owner)}

      </div>


      <div class="task-meta">

        <div class="meta">

          <i class="ri-global-line"></i>

          ${escapeHtml(
            task.platform || "-"
          )}

        </div>


        <div class="meta">

          <i class="ri-price-tag-3-line"></i>

          ${escapeHtml(
            task.subcategory || "-"
          )}

        </div>


        <div class="meta">

          <i class="ri-time-line"></i>

          ${dateFormat(
            task.createdAt
          )}

        </div>

      </div>


      <div class="task-values">

        <div class="value">

          <strong>
            ${money(task.unitPrice)}
          </strong>

          <span>
            Per Worker
          </span>

        </div>


        <div class="value">

          <strong>
            ${task.workers || 0}
          </strong>

          <span>
            Workers
          </span>

        </div>


        <div class="value">

          <strong>
            ${money(task.totalCost)}
          </strong>

          <span>
            Total Cost
          </span>

        </div>

      </div>


      <div class="submission-count">

        <i class="ri-file-list-3-line"></i>

        ${submissions.length}
        submission${submissions.length !== 1 ? "s" : ""}

    list.appendChild(card);

  });

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

  let pending = 0;

  let approved = 0;

  let rejected = 0;


  allTasks.forEach(task => {

    (
      task.submissions || []
    ).forEach(sub => {

      const status =
        String(
          sub.status || "pending"
        ).toLowerCase();


      if (
        status === "pending"
      ) pending++;


      if (
        status === "approved"
      ) approved++;


      if (
        status === "rejected"
      ) rejected++;

    });

  });


  document.getElementById(
    "totalTasks"
  ).textContent =
    allTasks.length;


  document.getElementById(
    "pendingSubmissions"
  ).textContent =
    pending;


  document.getElementById(
    "approvedSubmissions"
  ).textContent =
    approved;


  document.getElementById(
    "rejectedSubmissions"
  ).textContent =
    rejected;

}

  const task =
    allTasks.find(
      t => t.id === taskId

  if (!task) {

      status === "rejected"

          <i class="ri-close-circle-line"></i>

          </div>

          <div class="worker-id">

            ${escapeHtml(

/* =========================================================
   APPROVE SUBMISSION
========================================================= */

async function approveSubmission(
  taskId,
  submissionId,
  userId
) {

  if (!currentUser) {

    showToast(
      "Admin session expired.",
      "error"
    );

    return;

  }


  const task =
    allTasks.find(
      t => t.id === taskId
    );


  if (!task) {

    showToast(
      "Task not found.",
      "error"
    );

    return;

  }


  if (!userId) {

    showToast(
      "This submission has no worker user ID.",
      "error"
    );

    return;

  }


  const reward =
    Number(
      task.unitPrice || 0
    );


  if (
    !isFinite(reward) ||
    reward <= 0
  ) {

    showToast(
      "Invalid task reward amount.",
      "error"
    );

    return;

  }


  if (
    !confirm(
      `Approve this submission and credit ${money(reward)} to the worker?`
    )
  ) {

    return;

  }


  try {

    showLoading(
      "Processing approval..."
    );


    /*
      Get submission first.
    */

    const subRef =
      db
        .collection(
          "advert_submissions"
        )
        .doc(submissionId);


    const subSnap =
      await subRef.get();


    if (!subSnap.exists) {

      throw new Error(
        "Submission no longer exists."
      );

    }


    const subData =
      subSnap.data() || {};


    const currentStatus =
      String(
        subData.status ||
        "pending"
      ).toLowerCase();


    /*
      CRITICAL:

      Never pay an already-approved
      submission.
    */

    if (
      currentStatus === "approved"
    ) {

      hideLoading();

      showToast(
        "This submission has already been approved.",
        "info"
      );

      return;

    }


    /*
      Make sure the submitted user ID
      matches the user being paid.
    */

    const actualUserId =
      subData.userId ||
      subData.uid ||
      userId;


    if (!actualUserId) {

      throw new Error(
        "Worker user ID is missing."
      );

    }


    const userRef =
      db
        .collection("users")
        .doc(actualUserId);


    const taskRef =
      db
        .collection("advertise_tasks")
        .doc(taskId);


    const userSnap =
      await userRef.get();


    const batch =
      db.batch();


    const now =
      firebase.firestore
        .FieldValue
        .serverTimestamp();


    /*
      1. Mark submission approved
    */

    batch.update(
      subRef,
      {

        status:
          "approved",

        reviewedAt:
          now,

        reviewedBy:
          currentUser.uid,

        reviewedByEmail:
          currentUser.email || ""

      }
    );


    /*
      2. Pay worker
    */

    if (
      userSnap.exists
    ) {

      batch.update(
        userRef,
        {

          balance:
            firebase.firestore
              .FieldValue
              .increment(reward),

          totalEarned:
            firebase.firestore
              .FieldValue
              .increment(reward),

          updatedAt:
            now

        }
      );

    } else {

      batch.set(
        userRef,
        {

          balance:
            reward,

          totalEarned:
            reward,

          createdAt:
            now,

          updatedAt:
            now

        },
        {
          merge: true
        }
      );

    }


    /*
      3. Update task approved count
    */

    batch.set(
      taskRef,
      {

        approvedCount:
          firebase.firestore
            .FieldValue
            .increment(1),

        updatedAt:
          now

      },
      {
        merge: true
      }
    );


    /*
      4. Create earnings record
    */

    const earningRef =
      db
        .collection("earnings")
        .doc();


    batch.set(
      earningRef,
      {

        userId:
          actualUserId,

        advertId:
          taskId,

        submissionId:
          submissionId,

        amount:
          reward,

        type:
          "task_reward",

        status:
          "completed",

        approvedBy:
          currentUser.uid,

        approvedByEmail:
          currentUser.email || "",

        createdAt:
          now

      }
    );


    /*
      Commit atomically.
    */

    await batch.commit();


    /*
      Update local copy.
    */

    const localSubmission =
      task.submissions.find(
        s => s.id === submissionId
      );


    if (
      localSubmission
    ) {

      localSubmission.status =
        "approved";

      localSubmission.reviewedAt =
        new Date();

    }


    task.approvedCount =
      Number(
        task.approvedCount || 0
      ) + 1;


    hideLoading();


    updateStats();

    renderTasks();

    renderSubmissions(task);


    showToast(
      `Approved. ${money(reward)} credited to worker.`,
      "success"
    );


  } catch(error) {

    console.error(
      "APPROVAL ERROR:",
      error
    );


    hideLoading();


    showToast(
      "Approval failed: " +
      (
        error.message ||
        "Unknown error"
      ),
      "error"
    );

  }

}


/* =========================================================
   REJECT SUBMISSION
========================================================= */

async function rejectSubmission(
  taskId,
  submissionId
) {

  if (!currentUser) {

    showToast(
      "Admin session expired.",
      "error"
    );

    return;

  }


  if (
    !confirm(
      "Reject this submission?"
    )
  ) {

    return;

  }


  try {

    showLoading(
      "Rejecting submission..."
    );


    const subRef =
      db
        .collection(
          "advert_submissions"
        )
        .doc(submissionId);


    const subSnap =
      await subRef.get();


    if (!subSnap.exists) {

      throw new Error(
        "Submission not found."
      );

    }


    const subData =
      subSnap.data() || {};


    const currentStatus =
      String(
        subData.status ||
        "pending"
      ).toLowerCase();


    /*
      Don't change an already
      approved submission to rejected.
    */

    if (
      currentStatus === "approved"
    ) {

      throw new Error(
        "An approved submission cannot be rejected."
      );

    }


    await subRef.update({

      status:
        "rejected",

      reviewedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp(),

      reviewedBy:
        currentUser.uid,

      reviewedByEmail:
        currentUser.email || ""

    });


    const task =
      allTasks.find(
        t => t.id === taskId
      );


    if (task) {

      const sub =
        task.submissions.find(
          s => s.id === submissionId
        );


      if (sub) {

        sub.status =
          "rejected";

      }


      renderSubmissions(task);

    }


    hideLoading();


    updateStats();

    renderTasks();


    showToast(
      "Submission rejected.",
      "success"
    );


  } catch(error) {

    console.error(
      "REJECTION ERROR:",
      error
    );


    hideLoading();


    showToast(
      "Rejection failed: " +
      (
        error.message ||
        "Unknown error"
      ),
      "error"
    );

  }

}


/* =========================================================
   ESCAPING
========================================================= */

function escapeJs(value) {

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


function escapeAttribute(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

/* =========================================================
   PREVENT LOADING FOREVER
========================================================= */

setTimeout(
  function() {

    const loading =
      document.getElementById(
        "loadingScreen"
      );


    if (
      loading.style.display !==
      "none"
    ) {

      /*
        This catches cases where
        Firebase Auth/Firestore never
        responds.
      */

      loading.innerHTML = `

        <div class="error-box"
             style="max-width:330px;margin:20px;">

          <i class="ri-time-line"></i>

          <h3>
            Loading timed out
          </h3>

          <p>
            Firebase did not finish responding.
            Check your Firebase configuration,
            authentication state, and Firestore
            security rules.
          </p>

          <button
            class="retry"
            onclick="location.reload()"
          >
            Reload Page
          </button>

        </div>

      `;

    }

  },
  15000
);
