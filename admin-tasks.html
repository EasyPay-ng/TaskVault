<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Admin Task Management — TaskVault</title>

  <link rel="icon"
        href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1775059285/logo_oo5yat.jpg"
        type="image/jpeg">

  <link rel="manifest" href="manifest.json">

  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
        rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    :root {
      --orange-main: #FF8C42;
      --orange-dark: #E67A35;
      --orange-light: #FFF0E6;

      --silk-bg: #FDFBF7;
      --white: #FFFFFF;

      --text-dark: #333333;
      --text-light: #888888;

      --success: #10B981;
      --success-light: #D1FAE5;

      --danger: #EF4444;
      --danger-light: #FEE2E2;

      --warning: #F59E0B;
      --warning-light: #FEF3C7;

      --info: #3B82F6;
      --info-light: #DBEAFE;

      --shadow-sm: 0 2px 6px rgba(255,140,66,.06);
      --shadow-md: 0 4px 12px rgba(255,140,66,.10);
      --shadow-lg: 0 8px 24px rgba(255,140,66,.15);

      --gradient-orange:
        linear-gradient(135deg,#FF8C42 0%,#FF6B35 100%);
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body {
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body {
      background:#e9ecef;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    button,
    input {
      font-family:'Poppins',sans-serif;
    }

    .app-container {
      width:100%;
      height:100dvh;
      max-width:430px;
      background:var(--silk-bg);
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    @media(min-width:768px) {
      .app-container {
        height:92dvh;
        max-height:850px;
        border-radius:24px;
        box-shadow:0 0 40px rgba(0,0,0,.12);
      }
    }

    /* ================= HEADER ================= */

    .header {
      background:var(--white);
      padding:14px 20px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-shrink:0;
      box-shadow:0 2px 10px rgba(0,0,0,.03);
      z-index:20;
    }

    .header-left {
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .back-btn {
      width:36px;
      height:36px;
      border-radius:10px;
      background:var(--orange-light);
      color:var(--orange-main);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      text-decoration:none;
      flex-shrink:0;
    }

    .header-title {
      font-size:14px;
      font-weight:800;
      color:var(--text-dark);
    }

    .header-subtitle {
      font-size:9px;
      color:var(--text-light);
      margin-top:2px;
    }

    .admin-badge {
      background:var(--success-light);
      color:#065F46;
      padding:5px 9px;
      border-radius:20px;
      font-size:8px;
      font-weight:800;
      text-transform:uppercase;
      flex-shrink:0;
    }

    /* ================= CONTENT ================= */

    .scroll-content {
      flex:1;
      overflow-y:auto;
      overflow-x:hidden;
      padding-bottom:85px;
    }

    .scroll-content::-webkit-scrollbar,
    .panel-body::-webkit-scrollbar {
      width:2px;
    }

    .scroll-content::-webkit-scrollbar-thumb,
    .panel-body::-webkit-scrollbar-thumb {
      background:var(--orange-light);
      border-radius:3px;
    }

    /* ================= ADMIN USER ================= */

    .admin-user {
      margin:14px 20px 0;
      padding:11px 13px;
      background:var(--white);
      border:1px solid rgba(255,140,66,.08);
      border-radius:12px;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:var(--shadow-sm);
    }

    .admin-user-icon {
      width:32px;
      height:32px;
      border-radius:50%;
      background:var(--orange-light);
      color:var(--orange-main);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex-shrink:0;
    }

    .admin-user-info {
      min-width:0;
      flex:1;
    }

    .admin-user-label {
      font-size:8px;
      color:var(--text-light);
      text-transform:uppercase;
      font-weight:700;
    }

    .admin-user-email {
      font-size:11px;
      font-weight:700;
      color:var(--text-dark);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* ================= STATS ================= */

    .stats-section {
      padding:12px 20px;
    }

    .stats-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:7px;
    }

    .stat-card {
      background:var(--white);
      border-radius:12px;
      padding:11px 5px;
      text-align:center;
      box-shadow:var(--shadow-sm);
      border:1px solid rgba(255,140,66,.06);
    }

    .stat-value {
      font-size:17px;
      line-height:1;
      font-weight:800;
      color:var(--orange-dark);
    }

    .stat-label {
      font-size:7px;
      color:var(--text-light);
      margin-top:5px;
      text-transform:uppercase;
      font-weight:700;
    }

    /* ================= CONTROLS ================= */

    .controls-section {
      padding:0 20px 12px;
    }

    .controls-row {
      display:flex;
      gap:8px;
    }

    .search-wrap {
      position:relative;
      flex:1;
    }

    .search-wrap i {
      position:absolute;
      left:11px;
      top:50%;
      transform:translateY(-50%);
      color:var(--text-light);
      font-size:14px;
    }

    .search-input {
      width:100%;
      border:1px solid rgba(255,140,66,.15);
      outline:none;
      background:var(--white);
      border-radius:10px;
      padding:10px 10px 10px 34px;
      font-size:11px;
      color:var(--text-dark);
    }

    .search-input:focus {
      border-color:var(--orange-main);
      box-shadow:0 0 0 3px rgba(255,140,66,.08);
    }

    .refresh-btn {
      width:40px;
      height:40px;
      border-radius:10px;
      border:1px solid rgba(255,140,66,.15);
      background:var(--white);
      color:var(--orange-main);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:17px;
    }

    .refresh-btn.spinning i {
      animation:spin .7s linear infinite;
    }

    /* ================= TASK LIST ================= */

    .list-section {
      padding:0 20px 20px;
    }

    .section-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding-bottom:9px;
    }

    .section-title {
      font-size:13px;
      font-weight:800;
      color:var(--text-dark);
      display:flex;
      align-items:center;
      gap:5px;
    }

    .section-title i {
      color:var(--orange-main);
    }

    .task-count {
      font-size:9px;
      color:var(--text-light);
      font-weight:600;
    }

    .task-list {
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .task-card {
      background:var(--white);
      border-radius:15px;
      padding:14px;
      box-shadow:var(--shadow-sm);
      border:1px solid rgba(255,140,66,.06);
      cursor:pointer;
      position:relative;
      overflow:hidden;
      transition:.25s ease;
    }

    .task-card:hover {
      transform:translateY(-1px);
      box-shadow:var(--shadow-md);
    }

    .task-card::before {
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:3px;
      height:100%;
      background:var(--orange-main);
    }

    .task-header {
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
    }

    .task-title {
      font-size:12px;
      line-height:1.4;
      font-weight:800;
      color:var(--text-dark);
      flex:1;
    }

    .status {
      padding:4px 8px;
      border-radius:20px;
      font-size:7px;
      font-weight:800;
      text-transform:uppercase;
      flex-shrink:0;
    }

    .status.pending {
      background:var(--warning-light);
      color:#92400E;
    }

    .status.approved,
    .status.active {
      background:var(--success-light);
      color:#065F46;
    }

    .status.rejected {
      background:var(--danger-light);
      color:#991B1B;
    }

    .task-meta {
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-bottom:10px;
    }

    .meta-item {
      font-size:9px;
      color:var(--text-light);
      display:flex;
      align-items:center;
      gap:3px;
    }

    .meta-item i {
      color:var(--orange-main);
      font-size:11px;
    }

    .task-details {
      border-top:1px dashed #e5e7eb;
      padding-top:9px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
    }

    .detail-box {
      text-align:center;
    }

    .detail-value {
      font-size:12px;
      font-weight:800;
      color:var(--text-dark);
    }

    .detail-label {
      font-size:7px;
      color:var(--text-light);
      text-transform:uppercase;
      margin-top:2px;
    }

    .submission-badge {
      display:inline-flex;
      align-items:center;
      gap:4px;
      margin-top:9px;
      padding:5px 9px;
      border-radius:20px;
      background:var(--orange-light);
      color:var(--orange-dark);
      font-size:8px;
      font-weight:800;
    }

    /* ================= EMPTY / ERROR ================= */

    .state-box {
      text-align:center;
      padding:45px 20px;
      background:var(--white);
      border-radius:15px;
    }

    .state-box i {
      font-size:42px;
      display:block;
      margin-bottom:10px;
    }

    .state-box.empty i {
      color:#ffd8bd;
    }

    .state-box.error i {
      color:var(--danger);
    }

    .state-box h3 {
      font-size:13px;
      font-weight:800;
      color:var(--text-dark);
      margin-bottom:5px;
    }

    .state-box p {
      font-size:10px;
      color:var(--text-light);
      line-height:1.5;
    }

    .retry-btn {
      border:0;
      background:var(--gradient-orange);
      color:white;
      padding:9px 16px;
      border-radius:9px;
      margin-top:13px;
      font-size:10px;
      font-weight:800;
      cursor:pointer;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      height:66px;
      background:var(--white);
      display:flex;
      align-items:center;
      justify-content:space-around;
      box-shadow:0 -4px 20px rgba(0,0,0,.05);
      z-index:1000;
    }

    .nav-item {
      text-decoration:none;
      color:var(--text-light);
      font-size:8px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
      padding:6px 13px;
      border-radius:12px;
    }

    .nav-item i {
      font-size:19px;
    }

    .nav-item.active {
      color:var(--orange-main);
      background:var(--orange-light);
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      backdrop-filter:blur(4px);
      z-index:5000;
      display:none;
      align-items:center;
      justify-content:center;
    }

    .overlay.show {
      display:flex;
    }

    .panel {
      width:100%;
      max-width:430px;
      height:100dvh;
      background:var(--silk-bg);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    @media(min-width:768px) {
      .panel {
        height:92dvh;
        max-height:850px;
        border-radius:24px;
      }
    }

    .panel-header {
      background:var(--gradient-orange);
      color:white;
      padding:14px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-shrink:0;
    }

    .panel-header h3 {
      font-size:13px;
      font-weight:800;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .close-btn {
      width:31px;
      height:31px;
      border-radius:50%;
      border:0;
      background:rgba(255,255,255,.2);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:16px;
    }

    .panel-body {
      flex:1;
      overflow-y:auto;
      padding:15px 18px 40px;
    }

    /* ================= TASK SUMMARY ================= */

    .summary {
      background:white;
      border-radius:14px;
      padding:14px;
      margin-bottom:13px;
      box-shadow:var(--shadow-sm);
    }

    .summary h4 {
      font-size:13px;
      color:var(--text-dark);
      font-weight:800;
      margin-bottom:7px;
    }

    .summary-meta {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .summary-meta span {
      font-size:9px;
      color:var(--text-light);
    }

    /* ================= SUBMISSIONS ================= */

    .submission {
      background:white;
      border-radius:14px;
      padding:13px;
      margin-bottom:9px;
      box-shadow:var(--shadow-sm);
      border:1px solid rgba(255,140,66,.06);
    }

    .submission-top {
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:flex-start;
    }

    .worker {
      font-size:11px;
      font-weight:800;
      color:var(--text-dark);
      word-break:break-word;
    }

    .submission-date {
      font-size:8px;
      color:var(--text-light);
      margin-top:3px;
    }

    .proof {
      margin-top:10px;
      padding:9px;
      border-radius:9px;
      background:#f8f8f8;
      font-size:10px;
      line-height:1.5;
      color:var(--text-dark);
      white-space:pre-wrap;
      word-break:break-word;
    }

    .proof-img {
      width:100%;
      max-height:220px;
      object-fit:cover;
      border-radius:10px;
      margin-top:9px;
      cursor:pointer;
    }

    .actions {
      display:flex;
      gap:7px;
      margin-top:10px;
    }

    .action-btn {
      flex:1;
      border:0;
      border-radius:9px;
      padding:9px;
      font-size:9px;
      font-weight:800;
      cursor:pointer;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:4px;
    }

    .approve {
      background:var(--success-light);
      color:#065F46;
    }

    .approve:hover {
      background:var(--success);
      color:white;
    }

    .reject {
      background:var(--danger-light);
      color:#991B1B;
    }

    .reject:hover {
      background:var(--danger);
      color:white;
    }

    .action-btn:disabled {
      opacity:.5;
      cursor:not-allowed;
    }

    .paid-message {
      margin-top:9px;
      background:var(--success-light);
      color:#065F46;
      padding:8px;
      border-radius:8px;
      font-size:9px;
      font-weight:700;
    }

    .rejected-message {
      margin-top:9px;
      background:var(--danger-light);
      color:#991B1B;
      padding:8px;
      border-radius:8px;
      font-size:9px;
      font-weight:700;
    }

    .no-submissions {
      text-align:center;
      padding:45px 20px;
      color:var(--text-light);
    }

    .no-submissions i {
      font-size:42px;
      color:#ffd8bd;
      display:block;
      margin-bottom:10px;
    }

    .no-submissions h4 {
      color:var(--text-dark);
      font-size:12px;
      margin-bottom:4px;
    }

    .no-submissions p {
      font-size:9px;
    }

    /* ================= LOADING ================= */

    .loading-overlay {
      position:fixed;
      inset:0;
      background:var(--silk-bg);
      z-index:10000;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:12px;
    }

    .spinner {
      width:35px;
      height:35px;
      border:3px solid var(--orange-light);
      border-top-color:var(--orange-main);
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    .loading-text {
      font-size:10px;
      font-weight:700;
      color:var(--text-light);
      letter-spacing:1px;
      text-align:center;
      max-width:280px;
    }

    /* ================= TOAST ================= */

    .toast {
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%) translateY(-100px);
      z-index:15000;
      background:white;
      border-radius:11px;
      padding:10px 15px;
      max-width:90%;
      box-shadow:0 8px 30px rgba(0,0,0,.15);
      font-size:10px;
      font-weight:700;
      opacity:0;
      visibility:hidden;
      transition:.3s ease;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .toast.show {
      opacity:1;
      visibility:visible;
      transform:translateX(-50%) translateY(0);
    }

    .toast.success {
      border-left:3px solid var(--success);
    }

    .toast.error {
      border-left:3px solid var(--danger);
    }

    .toast.info {
      border-left:3px solid var(--orange-main);
    }

    /* ================= ANIMATION ================= */

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .hidden {
      display:none !important;
    }

  </style>
</head>

<body>

<!-- ================= LOADING ================= -->

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">
    Checking admin login...
  </div>
</div>


<div class="app-container">

  <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="header-left">

      <a href="dashboard.html" class="back-btn">
        <i class="ri-arrow-left-line"></i>
      </a>

      <div>
        <div class="header-title">
          Admin Task Management
        </div>

        <div class="header-subtitle">
          Review all advertised task submissions
        </div>
      </div>

    </div>

    <div class="admin-badge">
      ADMIN
    </div>

  </header>


  <div class="scroll-content">

    <!-- ================= LOGGED USER ================= -->

    <div class="admin-user">

      <div class="admin-user-icon">
        <i class="ri-shield-user-line"></i>
      </div>

      <div class="admin-user-info">

        <div class="admin-user-label">
          Logged in as
        </div>

        <div class="admin-user-email" id="adminEmail">
          Checking...
        </div>

      </div>

    </div>


    <!-- ================= STATS ================= -->

    <section class="stats-section">

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-value" id="statTasks">0</div>
          <div class="stat-label">Tasks</div>
        </div>

        <div class="stat-card">
          <div class="stat-value" id="statSubmissions">
            0
          </div>
          <div class="stat-label">Submissions</div>
        </div>

        <div class="stat-card">
          <div class="stat-value"
               style="color:var(--warning)"
               id="statPending">
            0
          </div>
          <div class="stat-label">Pending</div>
        </div>

        <div class="stat-card">
          <div class="stat-value"
               style="color:var(--success)"
               id="statApproved">
            0
          </div>
          <div class="stat-label">Approved</div>
        </div>

      </div>

    </section>


    <!-- ================= SEARCH ================= -->

    <section class="controls-section">

      <div class="controls-row">

        <div class="search-wrap">

          <i class="ri-search-line"></i>

          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search tasks, owners, platform..."
          >

        </div>

        <button
          class="refresh-btn"
          id="refreshBtn"
          onclick="loadEverything()"
        >
          <i class="ri-refresh-line"></i>
        </button>

      </div>

    </section>


    <!-- ================= TASK LIST ================= -->

    <section class="list-section">

      <div class="section-header">

        <div class="section-title">
          <i class="ri-list-check-2"></i>
          All Advertised Tasks
        </div>

        <div class="task-count" id="taskCount">
          0 tasks
        </div>

      </div>

      <div class="task-list" id="taskList">

        <div class="state-box empty">

          <i class="ri-loader-4-line"></i>

          <h3>
            Loading tasks...
          </h3>

          <p>
            Please wait.
          </p>

        </div>

      </div>

    </section>

  </div>


  <!-- ================= NAV ================= -->

  <nav class="bottom-nav">

    <a href="menu.html" class="nav-item">
      <i class="ri-apps-line"></i>
      <span>Menu</span>
    </a>

    <a href="deposit.html" class="nav-item">
      <i class="ri-wallet-3-line"></i>
      <span>Deposit</span>
    </a>

    <a href="withdraw.html" class="nav-item">
      <i class="ri-upload-2-line"></i>
      <span>Withdraw</span>
    </a>

    <a href="profile.html" class="nav-item">

  /* =========================================================

  function escapeHtml(value) {

    return String(value ?? "")

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  function money(value) {

    const number = Number(value || 0);

    return "$" + number.toFixed(3);

  }


  function niceDate(timestamp) {

    try {

      if (!timestamp) {
        return "-";
      }

      if (timestamp.toDate) {
        timestamp = timestamp.toDate();
      }

      const date = new Date(timestamp);

      if (isNaN(date.getTime())) {
        return "-";
      }

      return date.toLocaleString(
        "en-US",
        {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch (error) {

      return "-";

    }

  }


  function showToast(message, type = "info") {

    const toast =
      document.getElementById("toast");

    let icon = "ri-information-line";

    if (type === "success") {
      icon = "ri-checkbox-circle-line";
    }

    if (type === "error") {
      icon = "ri-error-warning-line";
    }

    toast.className = "toast " + type;

    toast.innerHTML =
      `<i class="${icon}"></i>
       <span>${escapeHtml(message)}</span>`;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {

      toast.classList.remove("show");

    }, 3500);

  }


  function setLoading(show, message = "Loading...") {

    const overlay =

    if (!user || !user.email) {
      return false;

    const email =
      user.email.trim().toLowerCase();

    return ADMIN_EMAILS
      .map(e => e.toLowerCase())
      .includes(email);

  /* =========================================================
     AUTHENTICATION
  ========================================================= */

  async function startAuth() {

    try {

      /*
       * This keeps Firebase login available after
       * refreshing the page.
       */

      await auth.setPersistence(
        firebase.auth.Auth.Persistence.LOCAL
      );

    } catch (error) {

      console.warn(
        "Auth persistence error:",
        error
      );

    }


    let authResolved = false;


    /*
     * Safety timeout.
     *
     * If Firebase doesn't return an auth state,
     * the page will not remain on the loading screen forever.
     */

    const authTimeout =
      setTimeout(() => {

        if (!authResolved) {

          setLoading(false);

          document.getElementById(
            "taskList"
          ).innerHTML = `

            <div class="state-box error">

              <i class="ri-time-line"></i>

              <h3>
                Authentication timeout
              </h3>

              <p>
                Firebase did not return your login session.
                Make sure this website's domain is added
                to Firebase Authentication authorized domains.
              </p>

              <button
                class="retry-btn"
                onclick="location.reload()"
              >
                <i class="ri-refresh-line"></i>
                Reload
              </button>

            </div>

          `;

        }

      }, 12000);


    auth.onAuthStateChanged(async user => {

      authResolved = true;

      clearTimeout(authTimeout);


      console.log(
        "Firebase Auth User:",
        user
      );


      if (!user) {

        setLoading(false);

        document.getElementById(
          "adminEmail"
        ).textContent = "Not logged in";


        document.getElementById(
          "taskList"
        ).innerHTML = `

          <div class="state-box error">

            <i class="ri-lock-line"></i>

            <h3>
              No logged-in user
            </h3>

            <p>
              Firebase does not currently see a signed-in
              user on this page.
            </p>

            <button
              class="retry-btn"
              onclick="goLogin()"
            >
              <i class="ri-login-box-line"></i>
              Go to Login
            </button>

          </div>

        `;

        return;

      }


      currentUser = user;


      document.getElementById(
        "adminEmail"
      ).textContent = user.email || "Unknown";


      if (!isAdmin(user)) {

        setLoading(false);

        document.getElementById(
          "taskList"
        ).innerHTML = `

          <div class="state-box error">

            <i class="ri-shield-cross-line"></i>

            <h3>
              Unauthorized Access
            </h3>

            <p>

              <strong>
                ${escapeHtml(user.email)}

  function goLogin() {

  /* =========================================================
     LOAD ALL TASKS + SUBMISSIONS
  ========================================================= */

  async function loadEverything() {

    if (!currentUser) {

      showToast(
        "No Firebase user is logged in.",
        "error"
      );

      return;

    }


    if (!isAdmin(currentUser)) {

      showToast(
        "Administrator access required.",
        "error"
      );

      return;

    }


    const refresh =
      document.getElementById("refreshBtn");

    refresh.classList.add("spinning");


    setLoading(
      true,
      "Loading all advertised tasks..."
    );


    try {

      /*
       * IMPORTANT:
       *
       * No owner filter here.
       *
       * This gets EVERY advertised task.
       */

      const tasksSnapshot =
        await db
          .collection("advertise_tasks")
          .get();


      allTasks = [];


      tasksSnapshot.forEach(doc => {

        allTasks.push({

          id: doc.id,

          ...doc.data()

        });

      });


      /*
       * Sort newest first.
       */

      allTasks.sort((a, b) => {

        const aTime =
          a.createdAt?.toDate
            ? a.createdAt.toDate().getTime()
            : 0;

        const bTime =
          b.createdAt?.toDate
            ? b.createdAt.toDate().getTime()
            : 0;

        return bTime - aTime;

      });


      setLoading(
        true,
        "Loading task submissions..."
      );


      /*
       * Get ALL submissions once.
       *
       * This is easier for an admin page than
       * making one Firestore query for every task.
       */

      const submissionsSnapshot =
        await db
          .collection("advert_submissions")
          .get();


      allSubmissions = [];


      submissionsSnapshot.forEach(doc => {

        allSubmissions.push({

          id: doc.id,

          ...doc.data()

        });

      });


      /*
       * Attach submissions to their tasks.
       */

      allTasks.forEach(task => {

        task.submissions =
          allSubmissions.filter(
            submission =>
              submission.advertId === task.id
          );

        task.submissionCount =
          task.submissions.length;

        task.approvedCount =
          task.submissions.filter(
            submission =>
              String(
                submission.status || ""
              ).toLowerCase() === "approved"
          ).length;

        task.pendingCount =
          task.submissions.filter(
            submission =>
              String(
                submission.status || "pending"
              ).toLowerCase() === "pending"
          ).length;

      });


      renderTasks();

      updateStats();

      setLoading(false);


      showToast(
        `${allTasks.length} tasks loaded.`,
        "success"
      );


    } catch (error) {

  }

    currentTask = task;


    renderTaskPanel(task);


    document
      .getElementById("overlay")

    document.body.style.overflow =

     RENDER SUBMISSIONS
  ========================================================= */

  function renderTaskPanel(task) {

        "panelBody"
      );

      <div class="summary">

        <h4>
          ${escapeHtml(
            task.title ||
            "Untitled Task"

        </h4>

        <div class="summary-meta">

          <span>
            <i class="ri-global-line"></i>
            ${escapeHtml(

            )}
          </span>

          <span>
            <i class="ri-price-tag-3-line"></i>
            ${escapeHtml(

          </span>

                  alt="Submission proof"
                  onclick="window.open(

  /* =========================================================
     REVIEW SUBMISSION
  ========================================================= */

  async function reviewSubmission(
    taskId,
    submissionId,
    newStatus
  ) {

    if (!currentUser) {

      showToast(
        "Your admin session has expired.",
        "error"
      );

      return;

    }


    if (!isAdmin(currentUser)) {

      showToast(
        "Administrator access required.",
        "error"
      );

      return;

    }


    const task =
      allTasks.find(
        t =>
          t.id === taskId
      );


    if (!task) {

      showToast(
        "Task not found.",
        "error"
      );

      return;

    }


    const submission =
      (task.submissions || [])
        .find(
          s =>
            s.id === submissionId
        );


    if (!submission) {

      showToast(
        "Submission not found.",
        "error"
      );

      return;

    }


    const existingStatus =
      String(
        submission.status ||
        "pending"
      ).toLowerCase();


    /*
     * Prevent duplicate processing.
     */

    if (
      existingStatus ===
      "approved"
    ) {

      showToast(
        "This submission has already been approved.",
        "info"
      );

      return;

    }


    if (
      existingStatus ===
      "rejected"
    ) {

      showToast(
        "This submission has already been rejected.",
        "info"
      );

      return;

    }


    if (
      newStatus ===
      "rejected"
    ) {

      const confirmed =
        confirm(
          "Reject this submission?"
        );

      if (!confirmed) {
        return;
      }

    }


    if (
      newStatus ===
      "approved"
    ) {

      const confirmed =
        confirm(
          "Approve this submission and credit " +
          money(task.unitPrice) +
          " to the worker?"
        );

      if (!confirmed) {
        return;
      }

    }


    /*
     * We use a Firestore transaction.
     *
     * This is safer than simply reading balance,
     * changing it in JavaScript, then writing it back.
     */

    try {

      showToast(
        newStatus === "approved"
          ? "Approving and processing payment..."
          : "Rejecting submission...",
        "info"
      );


      const submissionRef =
        db
          .collection(
            "advert_submissions"
          )
          .doc(submissionId);


      const taskRef =
        db
          .collection(
            "advertise_tasks"
          )
          .doc(taskId);


      await db.runTransaction(
        async transaction => {

          /*
           * Re-read submission inside transaction
           * to prevent double approval.
           */

          const freshSubmission =
            await transaction.get(
              submissionRef
            );


          if (!freshSubmission.exists) {

            throw new Error(
              "Submission no longer exists."
            );

          }


          const freshData =
            freshSubmission.data();


          const freshStatus =
            String(
              freshData.status ||
              "pending"
            ).toLowerCase();


          if (
            freshStatus !==
            "pending"
          ) {

            throw new Error(
              "This submission has already been reviewed."
            );

          }


          const now =
            firebase.firestore.Timestamp.now();


          /*
           * Update submission.
           */

          transaction.update(
            submissionRef,
            {

              status:
                newStatus,

              reviewedAt:
                now,

              reviewedBy:
                currentUser.uid,

              reviewedByEmail:
                currentUser.email

            }
          );


          /*
           * APPROVAL
           */

          if (
            newStatus ===
            "approved"
          ) {

            const userId =
              freshData.userId;


            if (!userId) {

              throw new Error(
                "This submission does not contain a userId. The worker cannot be credited automatically."
              );

            }


            const reward =
              Number(
                task.unitPrice || 0
              );


            if (
              !Number.isFinite(
                reward
              ) ||
              reward <= 0
            ) {

              throw new Error(
                "This task has an invalid unit price."
              );

            }


            const userRef =
              db
                .collection("users")
                .doc(userId);


            const userSnapshot =
              await transaction.get(
                userRef
              );


            if (
              !userSnapshot.exists
            ) {

              /*
               * If the worker document doesn't
               * exist, create it.
               */

              transaction.set(
                userRef,
                {

                  balance:
                    reward,

                  totalEarned:
                    reward,

                  createdAt:
                    now,

                  updatedAt:
                    now

                },
                {
                  merge:true
                }
              );

            } else {

              transaction.update(
                userRef,
                {

                  balance:
                    firebase.firestore.FieldValue
                      .increment(
                        reward
                      ),

                  totalEarned:
                    firebase.firestore.FieldValue
                      .increment(
                        reward
                      ),

                  updatedAt:
                    now

                }
              );

            }


            /*
             * Increase task approved count.
             */

            transaction.update(
              taskRef,
              {

                approvedCount:
                  firebase.firestore.FieldValue
                    .increment(1)

              }
            );


            /*
             * Earnings audit record.
             */

            const earningRef =
              db
                .collection(
                  "earnings"
                )
                .doc();


            transaction.set(
              earningRef,
              {

                userId:
                  userId,

                advertId:
                  taskId,

                submissionId:
                  submissionId,

                amount:
                  reward,

                type:
                  "task_reward",

                status:
                  "completed",

                approvedBy:
                  currentUser.uid,

                approvedByEmail:
                  currentUser.email,

                createdAt:
                  now

              }
            );

          }

        }
      );


      /*
       * Update local data.
       */

      submission.status =
        newStatus;

      submission.reviewedAt =
        new Date();

      submission.reviewedBy =
        currentUser.uid;


      if (
        newStatus ===
        "approved"
      ) {

        task.approvedCount =
          Number(
            task.approvedCount || 0
          ) + 1;

      }


      /*
       * Refresh panel and task list.
       */

      renderTaskPanel(task);

      renderTasks();

      updateStats();


      showToast(

        newStatus === "approved"

          ? "Submission approved and worker credited."

          : "Submission rejected.",

        "success"

      );


    } catch (error) {

      console.error(
        "Review submission error:",
        error
      );


      showToast(
        error.message ||
        "Unable to process submission.",
        "error"
      );

    }

  }


  /* =========================================================
     CLOSE PANEL
  ========================================================= */

  function closeOverlay() {

    document
      .getElementById("overlay")
      .classList.remove("show");


    document.body.style.overflow =
      "";

    currentTask = null;

  }


  document
    .getElementById("overlay")
    .addEventListener(
      "click",
      event => {

        if (
          event.target.id ===
          "overlay"
        ) {

          closeOverlay();

        }

      }
    );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        closeOverlay();

      }

    }
  );


  /* =========================================================
     SEARCH
  ========================================================= */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      renderTasks
    );


  /* =========================================================
     START
  ========================================================= */

  startAuth();

</script>

</body>
</html>
